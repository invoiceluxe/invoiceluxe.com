<html lang="en">

    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Customer Management - Invoice Luxe | Manage Your Clients</title>
    <meta name="description" content="Manage your customer directory on Invoice Luxe. Store client details, VAT numbers, IBAN and contact information for fast invoice creation.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://invoiceluxe.com/customers.html" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root { --bg-oak: #8d6e63; --gold-main: #FFD700; --gold-deep: #b8860b; --text-main: #3e2723; --m-black: #121212; --danger: #880000; }
        body { margin: 0; background-color: var(--bg-oak); background-image: radial-gradient(circle at 50% -10%, #f5f5f5 0%, transparent 70%), url('https://www.transparenttextures.com/patterns/pichica-wood.png'); color: var(--text-main); font-family: 'Segoe UI Bold', sans-serif; min-height: 100vh; padding: 20px 15px 120px; box-sizing: border-box; }
        header { text-align: center; margin-bottom: 25px; padding-top: 20px; }
        .master-brand-seal { background: linear-gradient(145deg, var(--m-black) 20%, var(--gold-main) 50%, var(--gold-deep)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; letter-spacing: 3px; font-weight: 900; text-transform: uppercase; }
        .luxe-card { background: linear-gradient(145deg, #bcaaa4, #8d6e63); border-radius: 25px; padding: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2.5px solid var(--gold-main); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 9px; color: var(--m-black); margin-bottom: 4px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--gold-deep); background: #fff !important; color: #000 !important; outline: none; font-size: 13px; font-weight: 700; box-sizing: border-box; margin-bottom: 10px; }
        .btn-save { background: linear-gradient(135deg, var(--gold-main), var(--gold-deep)); color: #000; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-top: 10px; }
        .list-header { font-size: 11px; color: var(--m-black); font-weight: 900; margin: 25px 0 15px; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
        .c-item { background: rgba(255,255,255,0.15); padding: 18px; border-radius: 20px; margin-bottom: 12px; border: 1.5px solid var(--gold-main); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .c-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .c-name { font-weight: 900; color: var(--m-black); font-size: 15px; }
        .c-sub { font-size: 10px; color: var(--text-main); opacity: 0.8; font-weight: 700; }
        .actions { display: flex; gap: 15px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; }
        .btn-edit { color: var(--m-black); }
        .btn-del { color: var(--danger); }
        .footer-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); border-top: 3px solid var(--gold-main); border-radius: 25px 25px 0 0; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.3); }
        .btn-home { display: block; width: 100%; background: var(--m-black); color: var(--gold-main); text-align: center; padding: 14px; border-radius: 15px; text-decoration: none; font-weight: 900; text-transform: uppercase; font-size: 12px; border: 1px solid var(--gold-main); box-sizing: border-box; }
    </style>
</head>
<body>
    <header><h1 class="master-brand-seal">INVOICE LUXE</h1></header>
    <div class="luxe-card">
        <h2 id="L_TITLE" style="text-align:center; font-size: 14px; margin-top:0; color: var(--m-black);">CUSTOMER MANAGEMENT</h2>
        <input type="hidden" id="edit-index" value="-1">
        <label id="L_NAME">NAME / COMPANY</label>
        <input type="text" id="in-name">
        <div class="grid">
            <div><label id="L_MAIL">EMAIL</label><input type="email" id="in-mail"></div>
            <div><label id="L_MOB">PHONE</label><input type="tel" id="in-mob"></div>
        </div>
        <label id="L_ADR">ADDRESS</label>
        <input type="text" id="in-adr">
        <div class="grid">
            <div><label id="L_PC">POSTCODE</label><input type="text" id="in-pc"></div>
            <div><label id="L_CT">CITY</label><input type="text" id="in-ct"></div>
        </div>
        <div class="grid">
            <div><label id="L_VAT">VAT NUMBER</label><input type="text" id="in-vat"></div>
            <div><label id="L_TAX">TAX NUMBER</label><input type="text" id="in-tax"></div>
        </div>
        <button class="btn-save" id="B_SAVE" onclick="saveCust()">SAVE CUSTOMER</button>
    </div>

    <div class="list-header" id="L_LIST">REGISTERED CUSTOMERS</div>
    <div id="cust-list"></div>

    <div class="footer-nav">
        <a href="index.html" class="btn-home" id="B_HOME">BACK TO MAIN MENU</a>
    </div>

    <script>
        let currentLang = 'en';
        const trans = {
            tr: { title: "MÜŞTERİ YÖNETİMİ", name: "İSİM / ŞİRKET", mail: "E-POSTA", mob: "TELEFON", adr: "ADRES", pc: "POSTA KODU", ct: "ŞEHİR", vat: "KDV NUMARASI", tax: "VERGİ NO", save: "MÜŞTERİYİ KAYDET", edit: "BİLGİLERİ GÜNCELLE", list: "KAYITLI MÜŞTERİ LİSTESİ", home: "ANA MENÜYE DÖN", conf: "Bu müşteriyi silmek istediğine emin misin?" },
            nl: { title: "KLANTENBEHEER", name: "NAAM / BEDRIJF", mail: "E-MAIL", mob: "TELEFOON", adr: "ADRES", pc: "POSTCODE", ct: "STAD", vat: "BTW NUMMER", tax: "KVK NUMMER", save: "KLANT OPSLAAN", edit: "KLANT BIJWERKEN", list: "GEREGISTREERDE KLANTEN", home: "TERUG NAAR HOOFDMENU", conf: "Weet u het zeker?" },
            en: { title: "CUSTOMER MANAGEMENT", name: "NAME / COMPANY", mail: "EMAIL", mob: "PHONE", adr: "ADDRESS", pc: "POSTCODE", ct: "CITY", vat: "VAT NUMBER", tax: "TAX NUMBER", save: "SAVE CUSTOMER", edit: "UPDATE CUSTOMER", list: "REGISTERED CUSTOMER LIST", home: "BACK TO MAIN MENU", conf: "Are you sure you want to delete?" },
            de: { title: "KUNDENVERWALTUNG", name: "NAME / FIRMA", mail: "E-MAIL", mob: "TELEFON", adr: "ADRESSE", pc: "PLZ", ct: "STADT", vat: "MWST NUMMER", tax: "STEUERNUMMER", save: "KUNDE SPEICHERN", edit: "KUNDE AKTUALISIEREN", list: "REGISTRIERTE KUNDEN", home: "ZURÜCK ZUM MENÜ", conf: "Sind Sie sicher?" },
            fr: { title: "GESTION DES CLIENTS", name: "NOM / ENTREPRISE", mail: "EMAIL", mob: "TÉLÉPHONE", adr: "ADRESSE", pc: "CODE POSTAL", ct: "VILLE", vat: "N° TVA", tax: "SIRET / TAX", save: "ENREGISTRER", edit: "METTRE À JOUR", list: "LISTE DES CLIENTS", home: "RETOUR AU MENU", conf: "Voulez-vous vraiment supprimer?" },
            it: { title: "GESTIONE CLIENTI", name: "NOME / AZIENDA", mail: "EMAIL", mob: "TELEFONO", adr: "INDIRIZZO", pc: "CAP", ct: "CITTÀ", vat: "PARTITA IVA", tax: "CODICE FISCALE", save: "SALVA CLIENTE", edit: "AGGIORNA CLIENTE", list: "ELENCO CLIENTI", home: "TORNA AL MENU", conf: "Sei sicuro?" }
        };

        let t = trans['en'];

        function init() {
            currentLang = localStorage.getItem('global_lang') || 'en';
            t = trans[currentLang] || trans['en'];
            document.documentElement.lang = currentLang;
            document.getElementById('L_TITLE').innerText = t.title;
            document.getElementById('L_NAME').innerText = t.name;
            document.getElementById('L_MAIL').innerText = t.mail;
            document.getElementById('L_MOB').innerText = t.mob;
            document.getElementById('L_ADR').innerText = t.adr;
            document.getElementById('L_PC').innerText = t.pc;
            document.getElementById('L_CT').innerText = t.ct;
            document.getElementById('L_VAT').innerText = t.vat;
            document.getElementById('L_TAX').innerText = t.tax;
            document.getElementById('B_SAVE').innerText = t.save;
            document.getElementById('L_LIST').innerText = t.list;
            document.getElementById('B_HOME').innerText = t.home;
            render();
        }

        function saveCust() {
            let data = JSON.parse(localStorage.getItem('pro_customers')) || [];
            let index = document.getElementById('edit-index').value;
            let newCust = {
                name: document.getElementById('in-name').value.trim(),
                mail: document.getElementById('in-mail').value.trim(),
                mob: document.getElementById('in-mob').value.trim(),
                adr: document.getElementById('in-adr').value.trim(),
                pc: document.getElementById('in-pc').value.trim(),
                ct: document.getElementById('in-ct').value.trim(),
                vat: document.getElementById('in-vat').value.trim(),
                tax: document.getElementById('in-tax').value.trim()
            };
            if(!newCust.name) return;
            if(index == "-1") { data.unshift(newCust); }
            else { data[index] = newCust; document.getElementById('edit-index').value = "-1"; document.getElementById('B_SAVE').innerText = t.save; }
            localStorage.setItem('pro_customers', JSON.stringify(data));
            clearInputs();
            render();
        }

        function edit(i) {
            let data = JSON.parse(localStorage.getItem('pro_customers'));
            let c = data[i];
            document.getElementById('in-name').value = c.name;
            document.getElementById('in-mail').value = c.mail || "";
            document.getElementById('in-mob').value = c.mob || "";
            document.getElementById('in-adr').value = c.adr;
            document.getElementById('in-pc').value = c.pc;
            document.getElementById('in-ct').value = c.ct;
            document.getElementById('in-vat').value = c.vat;
            document.getElementById('in-tax').value = c.tax;
            document.getElementById('edit-index').value = i;
            document.getElementById('B_SAVE').innerText = t.edit;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function clearInputs() {
            ['in-name','in-mail','in-mob','in-adr','in-pc','in-ct','in-vat','in-tax'].forEach(id => document.getElementById(id).value = "");
        }

        function render() {
            const list = document.getElementById('cust-list');
            let data = JSON.parse(localStorage.getItem('pro_customers')) || [];
            list.innerHTML = data.map((c, i) => `
                <div class="c-item">
                    <div class="c-info">
                        <span class="c-name">${c.name}</span>
                        <span class="c-sub">📧 ${c.mail || '-'}</span>
                        <span class="c-sub">📞 ${c.mob || '-'} | 📍 ${c.ct || '-'}</span>
                    </div>
                    <div class="actions">
                        <button class="action-btn btn-edit" onclick="edit(${i})"><span class="material-symbols-rounded">edit_note</span></button>
                        <button class="action-btn btn-del" onclick="del(${i})"><span class="material-symbols-rounded">delete_forever</span></button>
                    </div>
                </div>`).join('');
        }

        function del(i) {
            if(confirm(t.conf)) {
                let data = JSON.parse(localStorage.getItem('pro_customers'));
                data.splice(i, 1);
                localStorage.setItem('pro_customers', JSON.stringify(data));
                render();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
