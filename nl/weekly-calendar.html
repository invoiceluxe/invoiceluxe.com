    <style>
        :root { 
            --bg-main: #f4f7f6; 
            --card-bg: #ffffff; 
            --text-dark: #2d3748; 
            --text-muted: #718096;
            --green-primary: #2e7d32; 
            --green-hover: #1b5e20;
            --border-light: #e2e8f0;
            
            /* Siyah/Neon Renkler */
            --black-bg: #0a0a0a;
            --cell-bg: #1a1a1a;
            --neon-green: #00e676;
            --neon-blue: #3399ff;
        }
        
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background-color: var(--bg-main); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            color: var(--text-dark); 
            padding: 30px 15px; 
        }
        
        .main-wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        
        /* CARDS */
        .card { 
            background: var(--card-bg); 
            border: 2px solid var(--green-primary); 
            padding: 25px; 
            border-radius: 25px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.1); 
        }
        
        /* HEADER & LANG SELECTOR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: var(--green-primary); margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        
        .lang-select {
            background: var(--bg-main);
            border: 2px solid var(--green-primary);
            color: var(--text-dark);
            padding: 6px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .lang-select:hover { background: #e8f5e9; }

        /* NAVIGATION */
        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { background: var(--green-primary); color: #fff; border: none; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; transition: 0.2s; box-shadow: 0 4px 10px rgba(46,125,50,0.2); }
        .btn-nav:hover { background: var(--green-hover); transform: translateY(-2px); }
        .btn-nav:active { transform: scale(0.95); }
        
        .stat-box { margin: 10px 0; padding: 12px; background: #fafafa; border-radius: 18px; border: 1px solid var(--border-light); }
        .big-number { font-size: 38px; font-weight: 900; color: var(--green-primary); font-family: monospace; }
        .sub-text { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .date-range { font-size: 15px; font-weight: bold; margin-top: 5px; color: var(--text-dark); }
        
        /* SİYAH TARİH ARALIĞI KUTUSU */
        #date-range-box {
            background: var(--black-bg);
            border: 2px solid var(--green-primary);
        }
        #date-range-box .sub-text { color: #888; }
        #date-range-box .date-range { color: #fff; }

        /* HAFTALIK TOPLU İŞLEM BUTONLARI */
        .batch-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-batch { padding: 10px 4px; border-radius: 12px; border: none; font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; text-transform: uppercase; color: #fff; transition: 0.2s; text-align: center; }
        .btn-batch-wa { background: #25D366; } .btn-batch-wa:hover { background: #1da851; }
        .btn-batch-pdf { background: #E53935; } .btn-batch-pdf:hover { background: #c62828; }
        .btn-batch-share { background: #FF9800; } .btn-batch-share:hover { background: #F57C00; }

        /* SİYAH TAKVİM STİLLERİ */
        .calendar-card {
            background: var(--black-bg);
            border: 2px solid var(--green-primary);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            color: #fff;
        }
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--neon-green); font-weight: bold; font-size: 15px; margin-bottom: 15px; text-transform: uppercase;
        }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .day-name { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 6px; }
        .day-cell {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 13px; font-weight: bold;
            background: var(--cell-bg); border: 1px solid #333; cursor: pointer; transition: all 0.2s ease; position: relative; color: #fff;
        }
        .day-cell:hover { border-color: var(--neon-green); background: #2a2a2a; }
        
        .day-cell.active-week {
            background: rgba(0, 230, 118, 0.15); border: 2px solid var(--neon-green); color: var(--neon-green); font-weight: 900;
        }
        .day-cell.has-note {
            background: rgba(51, 153, 255, 0.2) !important;
            border: 2px solid var(--neon-blue) !important;
            color: var(--neon-blue) !important;
            box-shadow: 0 0 12px rgba(51, 153, 255, 0.4);
            animation: pop 0.3s ease;
        }
        @keyframes pop { 50% { transform: scale(1.1); } }
        .day-cell.other-month { opacity: 0.2; pointer-events: none; }

        /* BACK BUTTON */
        .back-btn { 
            margin-top: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
            padding: 12px 20px; background: #fff; color: var(--green-primary); border: 2px solid var(--green-primary); 
            border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 12px; text-transform: uppercase; transition: 0.2s; width: 100%;
        }
        .back-btn:hover { background: var(--green-primary); color: #fff; }

        /* INFO CARD */
        .info-card {
            background: var(--card-bg);
            border: 2px dashed var(--green-primary);
            padding: 20px;
            border-radius: 20px;
            text-align: left;
        }
        .info-card h3 { color: var(--green-primary); margin-top: 0; font-size: 14px; text-transform: uppercase; margin-bottom: 8px;}
        .info-card p { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin: 0; }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border: 2px solid var(--green-primary); border-radius: 20px;
            width: 100%; max-width: 400px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 15px; }
        .modal-title { font-weight: bold; color: var(--green-primary); font-size: 15px; text-transform: uppercase; }
        .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 22px; font-weight: bold; }
        .close-btn:hover { color: #f44336; }
        
        .note-textarea {
            width: 100%; height: 110px; background: #f8fafc; border: 2px solid var(--border-light); border-radius: 12px;
            color: var(--text-dark); padding: 12px; font-family: inherit; font-size: 14px; resize: none; margin-bottom: 15px; outline: none; transition: 0.2s;
        }
        .note-textarea:focus { border-color: var(--neon-blue); background: #fff; }
        
        .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-action { padding: 10px; border-radius: 10px; border: none; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; text-transform: uppercase; transition: 0.2s; color: #fff; }
        .btn-save { background: #1976d2; grid-column: span 2; font-size: 13px; padding: 12px; }
        .btn-save:hover { background: #1565c0; }
        .btn-wa { background: #25D366; } .btn-wa:hover { background: #1da851; }
        .btn-preview { background: var(--text-muted); } .btn-preview:hover { background: var(--text-dark); }
        .btn-pdf { background: #E53935; } .btn-pdf:hover { background: #c62828; }
        .btn-share-pdf { background: #FF9800; } .btn-share-pdf:hover { background: #F57C00; }
        
        .preview-box { display: none; background: #f0f4f8; border-left: 4px solid var(--neon-blue); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 15px; font-size: 13px; color: var(--text-dark); white-space: pre-wrap; word-break: break-word; text-align: left; }

        .legend { display: flex; gap: 15px; justify-content: center; margin-top: 15px; font-size: 11px; font-weight: bold; color: #888; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 4px; }
        .dot.green { background: rgba(0, 230, 118, 0.15); border: 2px solid var(--neon-green); }
        .dot.blue { background: rgba(51, 153, 255, 0.2); border: 2px solid var(--neon-blue); }
    </style>
</head>

            <div class="nav-controls">

            <div class="stat-box">

            <div class="stat-box" id="date-range-box">

                <div class="date-range" id="date-range">--</div>
            </div>

            <!-- Haftalık Toplu İşlem Butonları -->
            <div class="batch-actions">
                <button class="btn-batch btn-batch-wa" onclick="shareBatchWhatsApp()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">share</span> <span id="L_BATCH_WA">Share</span>
                </button>
                <button class="btn-batch btn-batch-pdf" onclick="downloadBatchPDF()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">download</span> <span id="L_BATCH_PDF">PDF</span>
                </button>
                <button class="btn-batch btn-batch-share" onclick="shareBatchPDFNative()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">ios_share</span> <span id="L_BATCH_SHARE_PDF">PDF Share</span>
                </button>
            </div>

            <a href="index.html" class="back-btn">
                <span class="material-symbols-rounded" style="font-size: 18px;">home</span>
                <span id="L_BACK">BACK TO MENU</span>
            </a>
        </div>

        <!-- BLACK CALENDAR -->
        <div class="calendar-card">
            <div class="cal-header">
                <span id="cal-month-year">--</span>
                <span class="material-symbols-rounded" style="color: var(--neon-green);">calendar_month</span>
            </div>
            
            <div class="cal-grid" id="cal-days-header"></div>
            <div class="cal-grid" id="cal-grid" style="margin-top: 8px;"></div>
            
            <div class="legend">
                <div class="legend-item"><div class="dot green"></div> <span id="L_LEGEND_ACTIVE">Active Week</span></div>
                <div class="legend-item"><div class="dot blue"></div> <span id="L_LEGEND_NOTE">Saved Note</span></div>
            </div>
        </div>

        <!-- INFO/DESCRIPTION CARD -->
        <div class="info-card">
            <h3 id="L_DESC_TITLE">How to Use?</h3>
            <p id="L_DESC_TEXT">Calculate your weeks, save daily notes, and track your business easily. Select a day on the calendar to add a note.</p>
        </div>
    </div>

    <!-- NOTE MODAL -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalDateStr">--</div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <textarea class="note-textarea" id="noteInput" placeholder="Write your note here..."></textarea>
            
            <div class="preview-box" id="previewBox"></div>

            <div class="modal-actions">
                <button class="btn-action btn-save" onclick="saveNote()">
                    <span class="material-symbols-rounded" style="font-size: 18px;">save</span>
                    <span id="L_BTN_SAVE">Save Note</span>
                </button>
                <button class="btn-action btn-wa" onclick="shareWhatsApp()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">share</span> WhatsApp
                </button>
                <button class="btn-action btn-preview" onclick="togglePreview()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">visibility</span> <span id="L_BTN_PREVIEW">Preview</span>
                </button>
                <button class="btn-action btn-pdf" onclick="downloadPDF()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">download</span> <span id="L_BTN_PDF">PDF</span>
                </button>
                <button class="btn-action btn-share-pdf" onclick="shareSinglePDFNative()">
                    <span class="material-symbols-rounded" style="font-size: 16px;">ios_share</span> <span id="L_BTN_SHARE_PDF">Share PDF</span>
                </button>
            </div>
        </div>
    </div>

        const LS_KEY = 'elite_lang_v1';
        let currentOffset = 0;
        let selectedDateKey = '';
        let currentWeekDaysData = []; 
        let t = dict['en']; 

        // Seçim kutusundan dili değiştirdiğinde çalışacak fonksiyon
        function changeLanguage() {
            const selLang = document.getElementById('langSelect').value;
            localStorage.setItem(LS_KEY, selLang);
            updateDisplay();
        }

        function getISOWeekDetails(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function updateDisplay() {
            let rawLang = (localStorage.getItem(LS_KEY) || 'en').trim().toLowerCase();
            const lang = dict[rawLang] ? rawLang : 'en'; 
            
            t = dict[lang]; 
            document.documentElement.lang = lang;
            
            // Açılır menüdeki seçimi eşitle
            document.getElementById('langSelect').value = lang;
            
            if(lang === 'ar') document.body.style.direction = 'rtl';
            else document.body.style.direction = 'ltr';

            document.getElementById('L_TITLE').innerText = t.title;
            document.getElementById('L_PREV').innerText = t.prev;
            document.getElementById('L_NEXT').innerText = t.next;
            document.getElementById('L_WEEK_LABEL').innerText = t.week;
            document.getElementById('L_DATE_LABEL').innerText = t.dates;
            document.getElementById('L_BACK').innerText = t.back;
            document.getElementById('L_BTN_SAVE').innerText = t.btnSave;
            document.getElementById('L_BTN_PREVIEW').innerText = t.btnPreview;
            document.getElementById('L_BTN_PDF').innerText = t.btnPdf;
            document.getElementById('L_BTN_SHARE_PDF').innerText = t.btnSharePdf;
            document.getElementById('noteInput').placeholder = t.notePlaceholder;
            document.getElementById('L_LEGEND_ACTIVE').innerText = t.legActive;
            document.getElementById('L_LEGEND_NOTE').innerText = t.legNote;
            
            document.getElementById('L_BATCH_WA').innerText = t.batchWa;
            document.getElementById('L_BATCH_PDF').innerText = t.batchPdf;
            document.getElementById('L_BATCH_SHARE_PDF').innerText = t.batchSharePdf;
            
            document.getElementById('L_DESC_TITLE').innerText = t.descTitle;
            document.getElementById('L_DESC_TEXT').innerText = t.descText;

            if (currentOffset === 0) {
                document.getElementById('L_NOW').innerText = t.now;
            } else {
                document.getElementById('L_NOW').innerText = currentOffset > 0 ? `+${currentOffset}${t.wks}` : `${currentOffset}${t.wks}`;
            }

            const now = new Date();
            const targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (currentOffset * 7));
            
            document.getElementById('week-number').innerText = getISOWeekDetails(targetDate);

            const monday = getMonday(targetDate);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            document.getElementById('date-range').innerText = `${monday.toLocaleDateString(lang, {month:'short', day:'numeric'})} - ${sunday.toLocaleDateString(lang, {month:'short', day:'numeric'})}`;

            renderCalendar(targetDate, monday, sunday, t, lang);
        }

        function renderCalendar(targetDate, monday, sunday, t, lang) {
            document.getElementById('cal-month-year').innerText = targetDate.toLocaleDateString(lang, { month: 'long', year: 'numeric' });
            document.getElementById('cal-days-header').innerHTML = t.days.map(d => `<div class="day-name">${d}</div>`).join('');
            
            const calGrid = document.getElementById('cal-grid');
            calGrid.innerHTML = '';
            currentWeekDaysData = []; 
            
            const firstDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), 1);
            const lastDay = new Date(targetDate.getFullYear(), targetDate.getMonth() + 1, 0);
            let startDay = firstDay.getDay() || 7; 
            
            const prevMonthLastDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0).getDate();
            for (let i = startDay - 1; i > 0; i--) {
                calGrid.innerHTML += `<div class="day-cell other-month">${prevMonthLastDay - i + 1}</div>`;
            }

            const startActiveTime = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()).getTime();
            const endActiveTime = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate()).getTime();

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const currentDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), day);
                const currentTime = currentDate.getTime();
                const dateStrKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`;
                
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerText = day;

                const isActiveWeek = currentTime >= startActiveTime && currentTime <= endActiveTime;
                if (isActiveWeek) {
                    cell.classList.add('active-week');
                }
                
                const noteVal = localStorage.getItem('note_' + dateStrKey);
                if (noteVal) {
                    cell.classList.add('has-note');
                }

                if (isActiveWeek && noteVal) {
                    currentWeekDaysData.push({
                        dateFormatted: currentDate.toLocaleDateString(lang, { weekday:'short', month:'short', day:'numeric', year:'numeric' }),
                        note: noteVal
                    });
                }

                cell.addEventListener('click', () => openNoteModal(dateStrKey, currentDate.toLocaleDateString(lang, { weekday:'short', month:'short', day:'numeric', year:'numeric' })));
                calGrid.appendChild(cell);
            }
        }

        function changeWeek(n) { currentOffset += n; updateDisplay(); }
        document.getElementById('L_NOW').addEventListener('click', () => { currentOffset = 0; updateDisplay(); });

        function openNoteModal(dateKey, formattedDate) {
            selectedDateKey = dateKey;
            document.getElementById('modalDateStr').innerText = formattedDate;
            document.getElementById('noteInput').value = localStorage.getItem('note_' + dateKey) || '';
            document.getElementById('previewBox').style.display = 'none';
            document.getElementById('noteModal').classList.add('active');
        }

        function closeModal() { document.getElementById('noteModal').classList.remove('active'); }

        function saveNote() {
            const val = document.getElementById('noteInput').value.trim();
            if (val) localStorage.setItem('note_' + selectedDateKey, val);
            else localStorage.removeItem('note_' + selectedDateKey);
            closeModal(); updateDisplay();
        }

        function togglePreview() {
            const pBox = document.getElementById('previewBox');
            const val = document.getElementById('noteInput').value.trim();
            if (pBox.style.display === 'block') { pBox.style.display = 'none'; } 
            else { pBox.style.display = 'block'; pBox.innerText = val ? val : "---"; }
        }

        function shareWhatsApp() {
            const val = document.getElementById('noteInput').value.trim();
            const dateStr = document.getElementById('modalDateStr').innerText;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(`📅 *${dateStr}*

📝 *Note:* ${val}`)}`, '_blank');
        }

        function downloadPDF() {
            const val = document.getElementById('noteInput').value.trim();
            const dateStr = document.getElementById('modalDateStr').innerText;
            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html><head><title>Note - ${dateStr}</title><style>
                body { font-family: sans-serif; padding: 40px; color: #333; direction: ${document.body.style.direction}; }
                .card { border: 2px solid #2e7d32; padding: 30px; border-radius: 15px; background: #f8fafc; }
                h2 { color: #2e7d32; margin-top: 0; } p { font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
                </style></head><body><div class="card"><h2>Week Tracker</h2><hr><h3>📅 ${dateStr}</h3><p>${val || '---'}</p></div>
                <script>window.print();<\/script></body></html>`);
            printWin.document.close();
        }

        function shareBatchWhatsApp() {
            if (currentWeekDaysData.length === 0) {
                alert(t.noNote); 
                return;
            }
            let text = `📅 *${t.batchTitle}* (${t.batchWeek} ${document.getElementById('week-number').innerText})

`;
            currentWeekDaysData.forEach(item => {
                text += `📌 *${item.dateFormatted}*
${item.note}

-------------------
`;
            });
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }

        function downloadBatchPDF() {
            if (currentWeekDaysData.length === 0) {
                alert(t.noNote);
                return;
            }
            const weekNum = document.getElementById('week-number').innerText;
            const dateRangeText = document.getElementById('date-range').innerText;
            
            const printWin = window.open('', '_blank');
            let contentHTML = `<html><head><title>${t.batchTitle} - ${weekNum}</title><style>
                body { font-family: sans-serif; padding: 40px; color: #333; direction: ${document.body.style.direction}; }
                .card { border: 2px solid #2e7d32; padding: 30px; border-radius: 15px; background: #f8fafc; }
                h2 { color: #2e7d32; margin-top: 0; } 
                .note-block { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
                .date-title { font-weight: bold; color: #1976d2; }
                p { font-size: 14px; line-height: 1.5; white-space: pre-wrap; margin-top: 5px; }
                </style></head><body><div class="card">
                <h2>${t.batchTitle}</h2>
                <p><strong>${t.batchWeek}</strong> ${weekNum} | <strong>${t.batchDate}</strong> ${dateRangeText}</p><hr>`;
            
            currentWeekDaysData.forEach(item => {
                contentHTML += `<div class="note-block"><div class="date-title">📅 ${item.dateFormatted}</div><p>${item.note}</p></div>`;
            });

            contentHTML += `</div><script>window.print();<\/script></body></html>`;
            printWin.document.write(contentHTML);
            printWin.document.close();
        }

        async function shareSinglePDFNative() {
            const val = document.getElementById('noteInput').value.trim();
            const dateStr = document.getElementById('modalDateStr').innerText;
            
            if (!val) { alert(t.noNote); return; }
            if (!window.html2pdf) { alert("PDF library error."); return; }

            const element = document.createElement('div');
            element.innerHTML = `
                <div style="font-family: sans-serif; padding: 40px; color: #333; direction: ${document.body.style.direction};">
                    <h2 style="color: #2e7d32; margin-top: 0;">Week Tracker</h2><hr>
                    <h3 style="color: #1976d2;">📅 ${dateStr}</h3>
                    <p style="font-size: 15px; line-height: 1.6; white-space: pre-wrap;">${val}</p>
                </div>
            `;

            const opt = {
                margin:       0.5,
                filename:     `Note_${dateStr}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            try {
                const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
                const file = new File([pdfBlob], `Note_${dateStr}.pdf`, { type: 'application/pdf' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: `Note - ${dateStr}`,
                        files: [file]
                    });
                } else {
                    alert(t.errNoShare);
                    html2pdf().set(opt).from(element).save();
                }
            } catch (error) {
                console.error("PDF Share Error:", error);
            }
        }

        async function shareBatchPDFNative() {
            if (currentWeekDaysData.length === 0) {
                alert(t.noNote);
                return;
            }
            if (!window.html2pdf) { alert("PDF library error."); return; }
            
            const weekNum = document.getElementById('week-number').innerText;
            const dateRangeText = document.getElementById('date-range').innerText;
            
            const element = document.createElement('div');
            element.innerHTML = `
                <div style="font-family: sans-serif; padding: 40px; color: #333; direction: ${document.body.style.direction};">
                    <h2 style="color: #2e7d32; margin-top: 0;">${t.batchTitle}</h2>
                    <p><strong>${t.batchWeek}</strong> ${weekNum} | <strong>${t.batchDate}</strong> ${dateRangeText}</p><hr>
                    ${currentWeekDaysData.map(item => `
                        <div style="margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
                            <div style="font-weight: bold; color: #1976d2;">📅 ${item.dateFormatted}</div>
                            <p style="font-size: 14px; line-height: 1.5; white-space: pre-wrap; margin-top: 5px;">${item.note}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            
            const opt = {
                margin:       0.5,
                filename:     `Week_${weekNum}_Notes.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            try {
                const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
                const file = new File([pdfBlob], `Week_${weekNum}_Notes.pdf`, { type: 'application/pdf' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: `${t.batchTitle} - ${weekNum}`,
                        files: [file]
                    });
                } else {
                    alert(t.errNoShare);
                    html2pdf().set(opt).from(element).save();
                }
            } catch (error) {
                console.error("PDF Share Error:", error);
            }
        }

        // Uygulama Başlatma ve Tarayıcı Dili Algılama
        function initApp() {
            // Eğer daha önce dil seçilmemişse tarayıcı dilini al
            if (!localStorage.getItem(LS_KEY)) {
                const browserLang = 'nl';
                // Desteklediğimiz dillerden biriyse onu yap, değilse ingilizce kalsın
                if (dict[browserLang]) {
                    localStorage.setItem(LS_KEY, browserLang);
                } else {
                    localStorage.setItem(LS_KEY, 'en');
                }
            }
            updateDisplay();
        }

        window.onload = initApp;
        window.addEventListener('focus', updateDisplay); 
    </script>
