        .s-5 .total-card { border-color: var(--purple); background: rgba(139,92,246, 0.03); }
        .s-6 .total-card { background: #000; color: #fff; border: none; border-radius: 0; }
        .s-6 .total-card span, .s-7 .total-card span, .s-8 .total-card span { color: #fff !important; }
        .s-7 .total-card { background: var(--prestige); border: none; border-radius: 0; }
        .s-8 .total-card { background: #000; border: none; border-radius: 0; }

        .t-gr { border-top: 2.5px solid var(--accent); margin-top: 10px; padding-top: 10px; font-size: 26px; font-weight: 900; color: #000; display: flex; justify-content: space-between; }
        .s-5 .t-gr { border-color: var(--purple); color: var(--purple); }
        .s-6 .t-gr { border-color: var(--swiss); color: var(--swiss); }
        .s-7 .t-gr { border-color: var(--gold); color: var(--gold); }
        .s-8 .t-gr { border-color: #fff; color: #fff; }

        #pro-loader { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .pro-spinner { width: 70px; height: 70px; border: 8px solid rgba(255,255,255,0.1); border-top: 8px solid var(--gold); border-radius: 50%; animation: spin 1s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .top-nav-box { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back { background: #475569; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 800; font-size: 11px; text-transform: uppercase; border: 1px solid #64748b; transition: 0.2s; }
        .btn-back:hover { background: #334155; }


        /* User uploaded logo */
        .user-logo {
            width: 72px; height: 72px; object-fit: cover; flex: none;
            background: #fff; border: 1px solid #e5e7eb;
            display: none;
        }
        .user-logo[data-shape="round"] { border-radius: 50%; }
        .user-logo[data-shape="rounded"] { border-radius: 22%; }
        .user-logo[data-shape="square"] { border-radius: 0; }
        .logo-wrap.has-user-logo .seal-svg-container { display: none; }
        .logo-wrap.has-user-logo .user-logo { display: block; }

        /* Bigger action buttons - eye catching */
        .btn-area {
            display: flex; justify-content: center; gap: 20px; margin: 28px 0 40px;
            position: relative; z-index: 50;
        }
        .btn-action {
            min-width: 260px; height: 58px; border: none; border-radius: 16px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 16px;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            color: #fff; position: relative; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-action:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
        .btn-action:active { transform: translateY(0) scale(0.98); }
        .btn-dl {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            border: 2px solid #64748b;
        }
        .btn-sh {
            background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
            border: 2px solid #6ee7b7;
            animation: pulse-glow 2.2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 24px rgba(16,185,129,0.35); }
            50% { box-shadow: 0 8px 36px rgba(16,185,129,0.65), 0 0 20px rgba(52,211,153,0.4); }
        }
        .btn-action .spin-letter {
            display: inline-block;
            animation: letter-spin 3s linear infinite;
        }
        @keyframes letter-spin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
            100% { transform: rotateY(360deg); }
        }
        .btn-action .icon { font-size: 20px; line-height: 1; }


        /* Style label badges for new styles */
        .new-badge { font-size: 8px; background: #f59e0b; color: #000; padding: 1px 4px; border-radius: 3px; margin-left: 3px; font-weight: 900; vertical-align: middle; }
    </style>
</head>
<body>

        <div class="pro-spinner"></div>
        <div id="pro-wait-text" style="margin-top:20px; font-weight:900;">SYSTEM PREPARING...</div>

    <div class="no-print-top">
        <div class="top-nav-box">

        </div>
        <div class="btn-grid">
            <button class="btn-p" onclick="setStyle(1)"  style="background:#2e8540;">Style 1 · G-1</button>
            <button class="btn-p" onclick="setStyle(2)"  style="background:#2563eb;">Style 2</button>
            <button class="btn-p" onclick="setStyle(3)"  style="background:#fbbf24; color:#000;">Style 3</button>
            <button class="btn-p" onclick="setStyle(4)"  style="background:#64748b;">Style 4</button>
            <button class="btn-p" onclick="setStyle(5)"  style="background:#8b5cf6;">Style 5</button>

            <button class="btn-p" onclick="setStyle(11)" style="background:#4a7c59;">Style 11 ✦</button>
            <button class="btn-p" onclick="setStyle(12)" style="background:#1a1a1a; border:1px solid #39ff14; color:#39ff14; font-family:monospace;">Style 12 ✦</button>
            <button class="btn-p" onclick="setStyle(13)" style="background:#10b981;">Classic 1</button>
            <button class="btn-p" onclick="setStyle(14)" style="background:#3b82f6;">Corp 2 (G-2)</button>
            <button class="btn-p" onclick="setStyle(15)" style="background:#65a30d;">Corp 3 (G-3)</button>
            <button class="btn-p" onclick="setStyle(16)" style="background:#84cc16;">Corp Excel</button>
            <button class="btn-p" onclick="setStyle(17)" style="background:#6b7280;">Corp Box</button>
            <button class="btn-p" onclick="setStyle(18)" style="background:#1e3a8a;">Corp Classic</button>
            <button class="btn-p" onclick="setStyle(19)" style="background:#14532d;">Interim ✦</button>
            <button class="btn-p" onclick="setStyle(20)" style="background:#f7c944; color:#000;">Yellow Brand ✦</button>
            <button class="btn-p" onclick="setStyle(21)" style="background:#1e3a5f;">Tax Invoice ✦</button>
            <button class="btn-p" onclick="setStyle(22)" style="background:#2563eb;">Agency Blue ✦</button>
            <button class="btn-p" onclick="setStyle(23)" style="background:#b91c1c;">Minimal Red ✦</button>
            <button class="btn-p" onclick="setStyle(24)" style="background:#34a88a;">Diagonal Teal ✦</button>
            <button class="btn-p" onclick="setStyle(25)" style="background:#10b981;">Wave Green ✦</button>
            <button class="btn-p" onclick="setStyle(26)" style="background:#2563eb;">Wave Blue ✦</button>
            <button class="btn-p" onclick="setStyle(27)" style="background:#0f172a;">Diagonal Dark ✦</button>
            <button class="btn-p" onclick="setStyle(28)" style="background:#2563eb;">Clean Agency ✦</button>
            <button class="btn-p" onclick="setStyle(29)" style="background:#fbbf24; color:#000;">Yellow Navy ✦</button>
            <button class="btn-p" onclick="setStyle(30)" style="background:#64748b;">Minimal Classic ✦</button>
        </div>
    </div>

    <div class="master-container" id="pdf-render-area">
        <div class="invoice-box s-1" id="f-core">
            <div class="header">
                <div class="logo-wrap" id="logo-wrap">
                    <img id="user-logo" class="user-logo" alt="Logo" referrerpolicy="no-referrer" hidden />
                    <div class="seal-svg-container">
                        <svg viewBox="0 0 100 100">
                            <defs><path d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" id="outerPath"/></defs>
                            <circle cx="50" cy="50" fill="none" r="45" stroke-width="1.5" style="stroke: inherit;"/>
                            <text font-family="Montserrat, sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.5">
                                <textPath href="#outerPath" id="v-seal-name" startOffset="50%" text-anchor="middle">- COMPANY NAME -</textPath>
                            </text>
                            <text font-family="Cinzel, serif" font-size="24" font-weight="700" id="v-seal-letter" style="fill: inherit;" text-anchor="middle" x="50" y="52">S</text>
                            <text font-family="Montserrat, sans-serif" font-size="6" font-weight="800" id="v-seal-date-flat" style="fill: inherit;" text-anchor="middle" x="50" y="66">00.00.0000</text>
                        </svg>
                    </div>
                    <div class="logo-text" id="v-logo">-</div>
                </div>
                <div class="inv-meta" style="text-align:right;"><small id="l-topInv">INVOICE NO</small><div id="v-no" style="font-size:24px; font-weight:900;">#---</div></div>
            </div>
            <div class="content">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #f1f5f9; padding-bottom:10px;">
                    <div><small id="l-d">DATE</small><div id="v-date" style="font-weight:800;">-</div></div>
                    <div style="text-align:right"><small id="l-due">DUE DATE</small><div id="v-due-date" style="font-weight:800; color:#ef4444;">-</div><small id="v-due-days" style="font-weight:900; color:var(--accent); font-size:9px;">-</small></div>
                </div>
                <div class="grid">
                    <div class="card"><small id="l-from" style="color:var(--accent);">SENDER</small><b id="v-my-n">-</b><p id="v-my-det">-</p></div>
                    <div class="card"><small id="l-to" style="color:var(--accent);">BILL TO</small><b id="v-c-n">-</b><p id="v-c-det">-</p></div>
                </div>
                <table>
                    <thead><tr><th id="l-h1">DESCRIPTION</th><th id="l-q" style="text-align:right">QTY</th><th id="l-p" style="text-align:right">PRICE</th><th id="l-t" style="text-align:right">TOTAL</th></tr></thead>
                    <tbody id="v-list"/>
                </table>
            </div>
            <div class="footer">
                <div class="bank-card-new" id="v-bank-wrap">
                    <small id="l-pay" style="color:#64748b; font-weight:900;">BANK DETAILS</small>
                    <div class="iban-text" id="v-iban">-</div>
                </div>
                <div class="total-card">
                    <div style="display:flex; justify-content:space-between; font-size:13px;"><span id="l-sub">SUBTOTAL</span><span id="v-sub">0.00</span></div>
                    <div style="display:flex; justify-content:space-between; font-size:13px;"><span id="l-vat">VAT</span><span id="v-tax">0.00</span></div>
                    <div class="t-gr"><span id="l-total-text">TOTAL</span><span id="v-total">0.00</span></div>
                </div>
            </div>
        </div>
        <div class="btn-area">
            <button type="button" class="btn-action btn-dl" id="l-dl" onclick="runPDF('dl')">
                <span class="icon">⬇</span>
                <span id="l-dl-text"><span class="spin-letter">D</span>OWNLOAD PDF</span>
            </button>
            <button type="button" class="btn-action btn-sh" id="l-sh" onclick="runPDF('sh')">
                <span class="icon">↗</span>
                <span id="l-sh-text"><span class="spin-letter">S</span>HARE</span>
            </button>
        </div>
        <div class="invoice-box stamp-box" id="f-stamp" style="display:flex; justify-content:center; align-items:center;">
            <div class="stamp-inner" style="text-align:center">
                <h1 id="l-stampT">TIMESTAMP</h1>
                <p id="l-stampD">Digitally secured document.</p>
                <div id="v-hash" style="margin-top:30px; font-family:monospace; background:#fff; padding:20px; border:1px solid #e2e8f0; font-size:12px; word-break:break-all;">-</div>
            </div>
        </div>
    </div>

    <script>
    const dicts = {
        tr: {topInv:"FATURA NO", totalText:"TOPLAM", d:"TARİH", from:"GÖNDEREN", to:"ALICI", sub:"ARA TOPLAM", vat:"KDV", pay:"BANKA BİLGİLERİ", due:"VADE", h1:"AÇIKLAMA", q:"ADET", p:"FİYAT", t:"TOPLAM", stampT:"ZAMAN MÜHRÜ", stampD:"Doküman dijital mühürle korunmaktadır.", dl:"İNDİR (PDF)", sh:"PAYLAŞ", vlabel:"KDV NO", tlabel:"VERGİ NO", mob:"GSM", fix:"SABİT", dSuffix:"GÜN İÇİNDE ÖDE", wait:"SİSTEM HAZIRLIYOR...", pureInv:"FATURA", back:"⬅ FATURA MOTORUNA DÖN"},
        nl: {topInv:"FACTUUR NR", totalText:"TOTAAL", d:"DATUM", from:"AFZENDER", to:"NAAR", sub:"SUBTOTAAL", vat:"BTW", pay:"BANKGEGEVENS", due:"VERVALDATUM", h1:"OMSCHRIJVING", q:"AANTAL", p:"PRIJS", t:"TOTAAL", stampT:"TIJDSTEMPEL", stampD:"Document digitaal beveiligd.", dl:"DOWNLOAD", sh:"DELEN", vlabel:"KVK-NUMMER", tlabel:"BTW-NUMMER", mob:"MOBIEL", fix:"VAST", dSuffix:"DAGEN BETALEN", wait:"SYSTEEM BEREIDT VOOR...", pureInv:"FACTUUR", back:"⬅ TERUG NAAR FACTUUR MOTOR"},
        en: {topInv:"INVOICE NO", totalText:"TOTAL", d:"DATE", from:"SENDER", to:"BILL TO", sub:"SUBTOTAL", vat:"VAT", pay:"BANK DETAILS", due:"DUE DATE", h1:"DESCRIPTION", q:"QTY", p:"PRICE", t:"TOTAL", stampT:"TIMESTAMP", stampD:"Digitally secured document.", dl:"DOWNLOAD", sh:"SHARE", vlabel:"VAT NO", tlabel:"TAX ID", mob:"MOB", fix:"FIXED", dSuffix:"DAYS TO PAY", wait:"SYSTEM PREPARING...", pureInv:"INVOICE", back:"⬅ BACK TO INVOICE MOTOR"},
        de: {topInv:"RECHNUNG NR", totalText:"GESAMT", d:"DATUM", from:"ABSENDER", to:"EMPFÄNGER", sub:"ZWISCHENSUMME", vat:"MWST", pay:"BANKVERBINDUNG", due:"FÄLLIGKEIT", h1:"BESCHREIBUNG", q:"ANZAHL", p:"PREIS", t:"GESAMT", stampT:"ZEITSTEMPEL", stampD:"Dokument digital gesichert.", dl:"DOWNLOAD", sh:"TEILEN", vlabel:"UST-IDNR", tlabel:"STEUERNR", mob:"MOBIL", fix:"FESTNETZ", dSuffix:"TAGE ZAHLUNGSZIEL", wait:"SYSTEM BEREITET VOR...", pureInv:"RECHNUNG", back:"⬅ ZURÜCK ZUM INVOICE MOTOR"},
        fr: {topInv:"N° FACTURE", totalText:"TOTAL", d:"DATE", from:"EXPÉDITEUR", to:"DESTINATAIRE", sub:"SOUS-TOTAL", vat:"TVA", pay:"DÉTAILS BANCAIRES", due:"ÉCHÉANCE", h1:"DESCRIPTION", q:"QTÉ", p:"PRIX", t:"TOTAL", stampT:"TIMBRE FISCAL", stampD:"Document sécurisé.", dl:"TÉLÉCHARGER", sh:"PARTAGER", vlabel:"N° TVA", tlabel:"SIRET", mob:"PORTABLE", fix:"FIXE", dSuffix:"JOURS POUR PAYER", wait:"PRÉPARATION DU SYSTÈME...", pureInv:"FACTURE", back:"⬅ RETOUR AU MOTEUR DE FACTURE"},
        it: {topInv:"FATTURA N.", totalText:"TOTALE", d:"DATA", from:"MITTENTE", to:"A", sub:"IMPONIBILE", vat:"IVA", pay:"BANCA", due:"SCADENZA", h1:"DESCRIZIONE", q:"QTÀ", p:"PREZZO", t:"TOTALE", stampT:"MARCA TEMPORALE", stampD:"Protetto digitalmente.", dl:"SCARICA", sh:"CONDIVIDI", vlabel:"P.IVA", tlabel:"COD. FISC.", mob:"CELL", fix:"FISSO", dSuffix:"GIORNI PER PAGARE", wait:"SISTEMA IN PREPARAZIONE...", pureInv:"FATTURA", back:"⬅ TORNA AL MOTORE DI FATTURA"}
    };

    function getP(n) { return decodeURIComponent(new URLSearchParams(window.location.search).get(n) || "").replace(/\+/g, ' '); }

    function setStyle(n) {
        document.getElementById('f-core').className = 'invoice-box s-' + n;
        const colors = {1:'#2e8540',2:'#2563eb',3:'#fbbf24',4:'#64748b',5:'#8b5cf6',6:'#e11d48',7:'#1e3a8a',8:'#000',9:'#b45309',10:'#7ee8a2',11:'#4a7c59',12:'#39ff14',13:'#10b981',14:'#3b82f6',15:'#65a30d',16:'#84cc16',17:'#4b5563',18:'#2563eb',19:'#14532d',20:'#f7c944',21:'#1e3a5f',22:'#2563eb',23:'#b91c1c',24:'#34a88a',25:'#10b981',26:'#2563eb',27:'#1e40af',28:'#2563eb',29:'#fbbf24',30:'#64748b'};
        document.documentElement.style.setProperty('--accent', colors[n]);
    }

    async function runPDF(mode) {
        const globalLang = localStorage.getItem('global_lang') || 'en';
        const d = dicts[globalLang] || dicts.en;
        const senderName = getP('n') || "Company";
        const invoiceNo = getP('inv') || "---";
        const translateInv = d.pureInv || "Invoice";
        const safeSender = senderName.replace(/[^a-z0-9]/gi, '_');
        const finalFileName = `${safeSender}_${translateInv}_${invoiceNo}.pdf`;

        document.getElementById('pro-loader').style.display = 'flex';
        document.getElementById('pro-wait-text').innerText = d.wait;

        setTimeout(async () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const canvas1 = await html2canvas(document.getElementById('f-core'), { scale: 3, useCORS: true });
            doc.addImage(canvas1.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 210, 297);
            doc.addPage();
            const canvas2 = await html2canvas(document.getElementById('f-stamp'), { scale: 3, useCORS: true });
            doc.addImage(canvas2.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 210, 297);
            if(mode==='dl') doc.save(finalFileName);
            else {
                const blob = doc.output('blob');
                const file = new File([blob], finalFileName, {type:"application/pdf"});
                if(navigator.share) navigator.share({files:[file]});
            }
            document.getElementById('pro-loader').style.display = 'none';
        }, 1500);
    }

    window.onload = function() {
        document.documentElement.style.setProperty('--accent', '#2e8540');
        const globalLang = localStorage.getItem('global_lang') || 'en';
        const d = dicts[globalLang] || dicts.en;

        Object.keys(d).forEach(k => { if(document.getElementById('l-'+k)) document.getElementById('l-'+k).innerText = d[k]; });
        if (document.getElementById('b-back')) document.getElementById('b-back').innerText = d.back;

        // Bigger button labels (keep spin letter on first char)
        const dlEl = document.getElementById('l-dl-text');
        const shEl = document.getElementById('l-sh-text');
        if (dlEl) {
            const t = (d.dl || 'DOWNLOAD').replace(/\s*\(PDF\)/i,'').trim();
            dlEl.innerHTML = '<span class="spin-letter">' + t.charAt(0) + '</span>' + t.slice(1) + ' PDF';
        }
        if (shEl) {
            const t = (d.sh || 'SHARE').trim();
            shEl.innerHTML = '<span class="spin-letter">' + t.charAt(0) + '</span>' + t.slice(1);
        }

        const corpName = getP('n') || "COMPANY NAME";
        document.getElementById('v-seal-name').textContent = `* ${corpName.toUpperCase()} *`;
        document.getElementById('v-seal-letter').textContent = corpName.substring(0,1).toUpperCase();
        document.getElementById('v-logo').innerText = corpName;
        document.getElementById('v-my-n').innerText = corpName;

        // ----- Logo from create-invoice (logo=url | lk=localStorage key + ls=shape) -----
        (function applyLogo() {
            const wrap = document.getElementById('logo-wrap');
            const img = document.getElementById('user-logo');
            if (!wrap || !img) return;
            const shape = (getP('ls') || 'round').toLowerCase();
            img.setAttribute('data-shape', ['round','rounded','square'].includes(shape) ? shape : 'round');
            let src = getP('logo');
            const lk = getP('lk');
            if (!src && lk) {
                try { src = localStorage.getItem('print_logo_' + lk) || ''; } catch(e) {}
            }
            // Fallback: same company name in pro_profile
            if (!src) {
                try {
                    const prof = JSON.parse(localStorage.getItem('pro_profile') || 'null');
                    if (prof && prof.logo && (prof.n || '') === corpName) src = prof.logo;
                } catch(e) {}
            }
            if (src && (src.startsWith('http') || src.startsWith('data:image'))) {
                img.onload = function() {
                    img.hidden = false;
                    wrap.classList.add('has-user-logo');
                };
                img.onerror = function() {
                    img.hidden = true;
                    wrap.classList.remove('has-user-logo');
                };
                img.src = src;
            }
        })();

        const invD = getP('d');
        if(invD && invD.includes('-')){
            const p = invD.split('-');
            const dt = new Date(p[2], p[1]-1, p[0]);
            const dStr = dt.toLocaleDateString(globalLang === 'tr' ? 'tr-TR' : 'en-US');
            document.getElementById('v-date').innerText = dStr;
            document.getElementById('v-seal-date-flat').textContent = dStr;
            const days = parseInt(getP('due')) || 0;
            dt.setDate(dt.getDate() + days);
            document.getElementById('v-due-date').innerText = dt.toLocaleDateString(globalLang==='tr'?'tr-TR':'en-GB');
            document.getElementById('v-due-days').innerText = `${days} ${d.dSuffix}`;
        }
        document.getElementById('v-no').innerText = "#" + (getP('inv') || "---");
        if(getP('i')) { document.getElementById('v-iban').innerText = (getP('bnk') ? getP('bnk') + "\n" : "") + getP('i'); }

        function countryName(code) {
            code = String(code || '').trim().toUpperCase();
            if (!/^[A-Z]{2}$/.test(code)) return code || '';
            try {
                return new Intl.DisplayNames([globalLang === 'tr' ? 'tr' : globalLang], { type: 'region' }).of(code) || code;
            } catch (e) { return code; }
        }

        const buildInfo = (adr, pc, ct, countryCode, vat, tax, m, f, mail) => {
            let s = [];
            if (adr) s.push(adr);
            const pcCity = ((pc || '') + ' ' + (ct || '')).trim();
            if (pcCity) s.push(pcCity);
            const co = countryName(countryCode);
            if (co) s.push(co);
            if (vat) s.push(d.vlabel + ": " + vat);
            if (tax) s.push(d.tlabel + ": " + tax);
            if (mail) s.push(mail);
            if (m) s.push(d.mob + ": " + m);
            if (f) s.push(d.fix + ": " + f);
            return s.join("\n");
        };

        document.getElementById('v-my-det').innerText = buildInfo(getP('adr'), getP('pc'), getP('ct'), getP('sco'), getP('vat'), getP('k'), getP('mob'), getP('fix'), getP('mail'));
        document.getElementById('v-c-n').innerText = getP('c');
        document.getElementById('v-c-det').innerText = buildInfo(getP('cadr'), getP('cpc'), getP('cct'), getP('cco'), getP('cv'), getP('cx'), getP('cmob'), null, getP('cmail'));

        const sym = getP('sym') || "€", rawItems = getP('items').split('!!');
        let sub = 0, h = "";
        rawItems.forEach(it => { if(it.includes('|')) { const b = it.split('|'); const q = parseFloat(b[1])||0, p = parseFloat(b[2])||0, u = b[3]||""; const t = q*p; sub += t; h += `<tr><td>${b[0]}</td><td style='text-align:right'>${q} ${u}</td><td style='text-align:right'>${p.toFixed(2)}${sym}</td><td style='text-align:right'>${t.toFixed(2)}${sym}</td></tr>`; } });
        document.getElementById('v-list').innerHTML = h;
        const vr = parseFloat(getP('vrate'))||0, tx = sub * (vr/100);
        document.getElementById('v-sub').innerText = sub.toFixed(2) + sym;
        document.getElementById('v-tax').innerText = tx.toFixed(2) + sym + " (%" + vr + ")";
        document.getElementById('v-total').innerText = (sub+tx).toFixed(2) + sym;
        document.getElementById('v-hash').innerText = "SEC_ID: " + btoa(getP('inv') + Date.now()).toUpperCase().substring(0,30);
    };
    </script>
</body>
</html>
