            fr: {

                metaDesc: "Compressez vos fichiers instantanément dans votre navigateur sans téléversement. Rapide, gratuit ve 100% confidentiel.",

            it: {

                metaDesc: "Comprimi file direttamente nel browser senza caricamenti su server esterni. Strumento ZIP sicuro, rapido e privato.",
                alertErr: "Seleziona almeno un file da comprimere!",
                manTitle: "GUIDA RAPIDA UTENTE",
                manText: "1. Seleziona i file da archiviare dal tuo dispositivo. 2. Clicca su 'SCARICA ZIP' per compilare ed esportare istantaneamente la cartella compressa salvaguardando la banda internet.",
                seoTitle: "CREAZIONE ARCHIVI ZIP LOCALI E OTTIMIZZAZIONE DATI",
                seoText1: "L'ottimizzazione degli allegati aziendali è fondamentale. Il tool <strong>Creatore ZIP Invoice Luxe</strong> permette di condensare file multipli riducendo lo spazio di archiviazione digitale.",

        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('global_lang', lang);
            const t = dict[lang] || dict['en'];

            // Meta ve SEO Verilerinin Dinamik Yönetimi
            document.title = t.metaTitle;
            const metaDesc = document.querySelector('meta[name="description"]');
            if(metaDesc) { metaDesc.setAttribute('content', t.metaDesc); }
            document.documentElement.lang = lang;

            // Görsel Kart Alanları Metin Güncellemeleri
            document.getElementById('L_TITLE').innerText = t.title;
            document.getElementById('L_DESC').innerText = t.desc;
            document.getElementById('L_DOWN').innerText = t.down;
            document.getElementById('L_BACK').innerText = t.back;

            // Kılavuz ve SEO Panel Güncellemeleri
            document.getElementById('L_MANUAL_TITLE').innerText = t.manTitle;
            document.getElementById('L_MANUAL_TEXT').innerText = t.manText;
            document.getElementById('L_SEO_TITLE').innerText = t.seoTitle;
            document.getElementById('L_SEO_TEXT_1').innerHTML = t.seoText1;
            document.getElementById('L_SEO_TEXT_2').innerHTML = t.seoText2;

            // SEO için URL Yapısını Senkronize Etme
            const newUrl = window.location.pathname + '?lang=' + lang;
            window.history.replaceState({}, '', newUrl);
        }

        async function generateZip() {
            const fileInput = document.getElementById('file-input');
            const t = dict[currentLang] || dict['en'];
            
            if (fileInput.files.length === 0) {
                alert(t.alertErr);
                return;
            }
            
            const zip = new JSZip();
            for (let i = 0; i < fileInput.files.length; i++) {
                zip.file(fileInput.files[i].name, fileInput.files[i]);
            }
            
            try {
                const content = await zip.generateAsync({type: "blob"});
                const link = document.createElement("a");
                link.href = URL.createObjectURL(content);
                link.download = "InvoiceLuxe_Archive.zip";
                link.click();
            } catch (error) {
                console.error("ZIP Generation error:", error);
            }
        }

        window.onload = () => {
            // URL parametresi veya LocalStorage kontrolü ile başlangıç dili belirleme
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || localStorage.getItem('global_lang') || 'en';
            
            document.getElementById('lang-select').value = lang;
            changeLanguage(lang);
        };
    </script>
