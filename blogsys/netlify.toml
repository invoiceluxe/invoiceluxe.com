# Merge with your existing netlify.toml if you already have one.
[build]
  command = "node build.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Keep source files private (they sit in the publish folder)
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build.js"
  to = "/404.html"
  status = 404
  force = true

# Short, shareable links to the video demo (the video folder is yours: /video/create-invoice/index.html)
[[redirects]]
  from = "/demo"
  to = "/video/create-invoice/"
  status = 301

[[redirects]]
  from = "/video-demo"
  to = "/video/create-invoice/"
  status = 301
