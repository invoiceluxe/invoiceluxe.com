<head>
    <meta charset="UTF-8">

    <title id="main-title">Calculateur d'Heures de Travail | Invoice Luxe Tools</title>
    
    <!-- SEO Çok Dilli Hreflang Yapılandırması -->
    <link rel="alternate" hreflang="x-default" href="https://www.invoiceluxe.com/work-logger.html" />
    <link rel="alternate" hreflang="en" href="https://www.invoiceluxe.com/work-logger.html?lang=en" />
    <link rel="alternate" hreflang="tr" href="https://www.invoiceluxe.com/work-logger.html?lang=tr" />
    <link rel="alternate" hreflang="nl" href="https://www.invoiceluxe.com/work-logger.html?lang=nl" />
    <link rel="alternate" hreflang="de" href="https://www.invoiceluxe.com/work-logger.html?lang=de" />
    <link rel="alternate" hreflang="fr" href="https://www.invoiceluxe.com/work-logger.html?lang=fr" />
    <link rel="alternate" hreflang="it" href="https://www.invoiceluxe.com/work-logger.html?lang=it" />
    <meta name="robots" content="index, follow">
    <meta name="google" content="notranslate">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    
    <style>
        :root { --bg-oak: #8d6e63; --gold-main: #FFD700; --m-black: #121212; --card-bg: #1a1510; }
        * { box-sizing: border-box; }
        body { background: var(--bg-oak); background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png'); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .top-bar { width: 100%; padding: 15px 20px; background: var(--m-black); display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold-main); }
        .wrapper { width: 100%; max-width: 500px; padding: 15px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .work-card { background: var(--card-bg); border: 2px solid var(--gold-main); border-radius: 15px; padding: 15px; margin-bottom: 5px; position: relative; }
        .del-btn { position: absolute; top: 10px; right: 10px; color: #ff5252; cursor: pointer; font-size: 20px; }
        .date-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; margin-bottom: 15px; }
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .input-group label { font-size: 10px; color: var(--gold-main); text-align: center; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 10px 5px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; text-align: center; }
        .total-box { text-align: right; font-size: 16px; font-weight: 900; color: var(--gold-main); border-top: 1px dashed #555; padding-top: 10px; }
        .grand-total { background: #000; padding: 15px; border-radius: 12px; text-align: center; font-weight: 900; color: var(--gold-main); margin: 15px 0; border: 1px solid var(--gold-main); font-size: 18px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; text-transform: uppercase; font-size: 13px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-add { background: var(--gold-main); color: var(--m-black); }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-back { background: #333; color: var(--gold-main); border: 1px solid var(--gold-main); margin-bottom: 15px; }
        
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        select { background: #000; color: var(--gold-main); border: 1px solid var(--gold-main); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Kullanım Kılavuzu Kart Yapısı */
        .manual-card { background: var(--card-bg); border: 1px dashed rgba(255, 215, 0, 0.4); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .manual-title { font-size: 12px; color: var(--gold-main); font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .manual-text { font-size: 11.5px; color: #ccc; line-height: 1.5; text-align: left; }

        /* SEO Blog Bölümü CSS */
        .seo-section { margin-top: 25px; padding: 20px 15px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: left; }
        .seo-section h2 { color: var(--gold-main); font-size: 15px; margin-bottom: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .seo-section p { font-size: 12.5px; color: #bbb; line-height: 1.6; margin-bottom: 12px; }
        .seo-section p strong { color: #fff; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1 id="L_TITLE" style="margin: 0; font-size: 20px; color: var(--gold-main); letter-spacing: 1px;">WORK LOGGER</h1>
    </div>

    <div class="wrapper">
        <div class="control-row">
            <select id="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="tr">Türkçe</option>
                <option value="nl">Nederlands</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
            </select>
        </div>

        <button class="btn btn-back" onclick="goToHome()">
            <span id="L_BACK">← BACK TO HOME</span>
        </button>

        <!-- Dinamik Kullanım Kılavuzu -->
        <div class="manual-card">
            <div class="manual-title">
                <span class="material-symbols-rounded" style="font-size: 16px;">auto_stories</span>
                <span id="L_MANUAL_TITLE">USER MANUAL</span>
            </div>
            <p class="manual-text" id="L_MANUAL_TEXT">...</p>
        </div>

        <div id="log-list"></div>
        <div class="grand-total" id="G_TOTAL">TOTAL: 0h 0m</div>

        <button class="btn btn-add" onclick="addRow()"><span id="L_ADD">ADD DAY</span></button>
        <button class="btn btn-wa" onclick="shareWhatsApp()"><span id="L_SHARE">SHARE ON WHATSAPP</span></button>

        <!-- Google Güçlendirici SEO Mini Blog Alanı -->
        <div class="seo-section">
            <h2 id="L_SEO_TITLE">How to Use the Work Time Logger?</h2>
            <p id="L_SEO_TEXT_1">...</p>
            <p id="L_SEO_TEXT_2">...</p>
        </div>
    </div>

<script>
    const dict = {
        en: {

            desc: "Calculate your daily work hours, deduct break times, and track your net working hours instantly.",
            manTitle: "QUICK USER MANUAL",
            manText: "1. Select the work date. 2. Set your Shift Start and Shift End times (the logger automatically compensates for overnight night shifts). 3. Enter break deductions in minutes. Your net time calculations update instantly and save to local storage safely.",
            seoTitle: "EFFICIENT WORK HOURS TRACKING FOR PROFESSIONAL BILLING",
            seoText1: "Manually keeping logs of dynamic business hours can easily introduce errors. The <strong>Invoice Luxe Work Time Logger</strong> provides freelancers, corporate contractors, and remote operators an absolute automated suite to compute net active duty hours.",
            seoText2: "By evaluating exact launch intervals, break deductions, and micro-shifts, this <strong>overtime hours calculator</strong> prepares organized digests ready for reporting. Align your professional invoicing milestones seamlessly."
        },
        tr: { 
            title: "Mesaî Saat Hesaplama & İş Takip Programı | Invoice Luxe", start: "BAŞLAMA", end: "BİTİŞ", break: "MOLA", total: "NET", add: "YENİ GÜN EKLE", share: "WHATSAPP İLE PAYLAŞ", gtotal: "TOPLAM SÜRE:", back: "← ANA SAYFAYA DÖN", 
            desc: "Günlük mesai ve çalışma saatlerinizi hesaplayın, mola sürelerini düşün ve net çalışma sürenizi anında paylaşın.",
            manTitle: "HIZLI KULLANIM KILAVUZU",
            manText: "1. Çalıştığınız günü seçin. 2. İşe Giriş ve İş Bitiş saatlerini yazın (sistem gece vardiyalarını otomatik algılar). 3. Varsa mola süresini dakika bazında girin. Net mesai süreniz anlık hesaplanacak ve tarayıcınıza güvenle yedeklenecektir.",
            seoTitle: "PROFESYONELLER İÇİN ÇALIŞMA SAATİ HESAPLAMA VE MESAİ TAKİBİ",
            seoText1: "Günlük serbest çalışanların veya işletmelerin operasyonel verimliliğini ölçen en önemli kriter net zaman yönetimidir. <strong>Çalışma saati hesaplama</strong> modülümüz, karmaşık mola kesintilerini ve vardiya geçişlerini tek tıkla çözmenizi sağlar.",
            seoText2: "<strong>Invoice Luxe iş takip programı</strong> sayesinde, hak ettiğiniz hakedişleri ve fazla mesaileri hatasız raporlayabilir, oluşturduğunuz tablonun çıktısını WhatsApp üzerinden iş ortaklarınıza resmi bir özet olarak gönderebilirsiniz."
        },
        nl: { 
            title: "Werkuren Registratie & Berekenen | Invoice Luxe", start: "START", end: "EIND", break: "PAUZE", total: "NETTO", add: "DAG TOEVOEGEN", share: "DELEN OP WHATSAPP", gtotal: "TOTAAL:", back: "← TERUG NAAR HOME", 
            desc: "Bereken eenvoudig je dagelijkse werkuren, trek pauzes eraf en deel je netto uren direct via WhatsApp.",
            manTitle: "KORTE HANDLEIDING",
            manText: "1. Selecteer de datum. 2. Vul de start- en eindtijd in (nachtdiensten worden automatisch herkend). 3. Voer de pauze in minuten in. De netto werktijd wordt direct opgeslagen en berekend.",
            seoTitle: "EENVOUDIG WERKUREN BEREKENEN VOOR ZZP'ERS EN BEDRIJVEN",
            seoText1: "Het nauwkeurig bijhouden van uren is cruciaal voor een correcte facturatie. Met onze <strong>werkuren calculator</strong> registreert u probleemloos actieve uren minus pauzetijden, zonder handmatige fouten.",
            seoText2: "Gebruik de <strong>Invoice Luxe urenregistratie</strong> om uw wekelijkse of maandelijkse urenstaten te consolideren en stuur het overzicht direct door naar uw opdrachtgevers."
        },
        de: { 
            title: "Arbeitszeiterfassung & Rechner | Invoice Luxe", start: "START", end: "ENDE", break: "PAUSE", total: "NETTO", add: "TAG HINZUFÜGEN", share: "AUF WHATSAPP TEILEN", gtotal: "GESAMT:", back: "← ZURÜCK ZUR STARTSEITE", 
            desc: "Berechnen Sie tägliche Arbeitszeiten, ziehen Sie Pausen ab und teilen Sie Ihre Netto-Arbeitsstunden sofort.",
            manTitle: "KURZBESCHREIBUNG",
            manText: "1. Wählen Sie das Datum. 2. Geben Sie die Start- und Endzeit ein (Nachtschichten werden automatisch reguliert). 3. Tragen Sie die Pause in Minuten ein. Das Nettoergebnis wird automatisch kalkuliert.",
            seoTitle: "ZEITERFASSUNG UND ARBEITSSTUNDENRECHNER FÜR PROJEKTE",
            seoText1: "Fehlerfreie Dokumentation von Arbeitszeiten erhöht die Transparenz im B2B-Sektor. Der <strong>Invoice Luxe Arbeitsstundenrechner</strong> hilft Freiberuflern und Angestellten, Nettoarbeitszeiten präzise zu erfassen.",
            seoText2: "Optimieren Sie Ihre Projektmanagement-Abrechnungen, indem Sie Überstunden und Pausenregelungen lückenlos festhalten und digital teilen."
        },
        fr: { 
            title: "Calculateur d'Heures de Travail | Invoice Luxe", start: "DÉBUT", end: "FIN", break: "PAUSE", total: "NET", add: "AJOUTER UN JOU", share: "PARTAGER SUR WHATSAPP", gtotal: "TOTAL:", back: "← RETOUR À L'ACCUEIL", 
            desc: "Calculez vos heures de travail quotidiennes, déduisez les temps de pause et partagez vos heures nettes.",
            manTitle: "MANUEL D'UTILISATION",
            manText: "1. Sélectionnez la date. 2. Ajustez l'heure de début et de fin. 3. Saisissez la pause en minutes. Le système déduit automatiquement le repos pour afficher la durée nette réelle.",
            seoTitle: "CALCUL DES HEURES DE TRAVAIL ET DES HEURES SUPPLÉMENTAIRES",
            seoText1: "Gérer l'organisation du temps de travail demande de la rigueur. Notre <strong>calculateur d'heures de travail</strong> élimine les approximations lors de la création de vos rapports d'activité mensuels.",
            seoText2: "La solution de suivi <strong>Invoice Luxe Tools</strong> vous permet d'exporter rapidement vos synthèses d'heures vers WhatsApp pour simplifier la comptabilité."
        },
        it: { 
            title: "Calcolo Ore di Lavoro & Gestione Turni | Invoice Luxe", start: "INIZIO", end: "FINE", break: "PAUSA", total: "NETTO", add: "AGGIUNGI GIORNO", share: "CONDIVIDI SU WHATSAPP", gtotal: "TOTALE:", back: "← TORNA ALLA HOME", 
            desc: "Calcola le ore di lavoro giornaliere, detrai le pause e condividi istantaneamente le tue ore nette.",
            manTitle: "GUIDA RAPIDA UTENTE",
            manText: "1. Scegli la data di lavoro. 2. Inserisci gli orari di Inizio e Fine turno. 3. Specifica la durata della pausa in minuti. Il sistema calcolerà istantaneamente il monte ore netto.",
            seoTitle: "REGISTRAZIONE DELLE ORE DI LAVORO ORDINARIO E STRAORDINARIO",
            seoText1: "Calcolare accuratamente le ore di attività è fondamentale per la corretta emissione delle fatture. Il tool <strong>Calcolo Ore di Lavoro Invoice Luxe</strong> automatizza questo processo eliminando ogni rischio di svista.",
            seoText2: "Monitora i turni diurni o notturni e invia il resoconto riassuntivo finale direttamente su WhatsApp al tuo datore di lavoro o cliente."
        }
    };

    let currentLang = 'fr';

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('global_lang', lang);
        const d = dict[lang];

        // SEO ve Meta etiketleri dinamik yönetimi
        document.title = d.title;
        document.getElementById('meta-desc').content = d.desc;
        document.documentElement.lang = lang;
        
        // Sabit yazı alanları
        document.getElementById('L_TITLE').innerText = lang === 'tr' ? "İŞ TAKİP PRO" : "WORK LOGGER";
        document.getElementById('L_ADD').innerText = d.add;
        document.getElementById('L_SHARE').innerText = d.share;
        document.getElementById('L_BACK').innerText = d.back;
        
        // Kılavuz & SEO Alanları
        document.getElementById('L_MANUAL_TITLE').innerText = d.manTitle;
        document.getElementById('L_MANUAL_TEXT').innerText = d.manText;
        document.getElementById('L_SEO_TITLE').innerText = d.seoTitle;
        document.getElementById('L_SEO_TEXT_1').innerHTML = d.seoText1;
        document.getElementById('L_SEO_TEXT_2').innerHTML = d.seoText2;

        // URL Dil Parametresi Senkronizasyonu (SEO İndex Kalitesi İçin)
        const newUrl = window.location.pathname + '?lang=' + lang;
        window.history.replaceState({}, '', newUrl);

        // Mevcut aktif kartların dil dinamiklerini eşitleme
        document.querySelectorAll('.work-card').forEach(card => {
            if(card.querySelector('.lbl-s')) card.querySelector('.lbl-s').innerText = d.start;
            if(card.querySelector('.lbl-e')) card.querySelector('.lbl-e').innerText = d.end;
            if(card.querySelector('.lbl-b')) card.querySelector('.lbl-b').innerText = d.break;
            if(card.querySelector('.lbl-t')) card.querySelector('.lbl-t').innerText = d.total;
        });
        calcGrandTotal();
    }

    function goToHome() {
        save();
        window.location.href = "index.html";
    }

    function addRow(data = {d: new Date().toISOString().split('T')[0], s:'', e:'', b:''}) {
        const div = document.createElement('div');
        div.className = 'work-card';
        const d = dict[currentLang];
        div.innerHTML = `
            <span class="material-symbols-rounded del-btn" onclick="this.parentElement.remove(); save();">delete</span>
            <input type="date" class="d date-input" value="${data.d}" onchange="save()">
            <div class="time-grid">
                <div class="input-group"><label class="lbl-s">${d.start}</label><input type="time" class="s" value="${data.s}" onchange="calc(this); save();"></div>
                <div class="input-group"><label class="lbl-e">${d.end}</label><input type="time" class="e" value="${data.e}" onchange="calc(this); save();"></div>
                <div class="input-group"><label class="lbl-b">${d.break}</label><input type="number" class="b" value="${data.b}" onchange="calc(this); save();" placeholder="0"></div>
            </div>
            <div class="total-box"><span class="lbl-t">${d.total}</span>: <span class="total-val">0h 0m</span></div>
        `;
        document.getElementById('log-list').appendChild(div);
        calc(div.querySelector('.s'));
    }

    function save() {
        const rows = [];
        document.querySelectorAll('.work-card').forEach(card => {
            rows.push({ 
                d: card.querySelector('.d').value, 
                s: card.querySelector('.s').value, 
                e: card.querySelector('.e').value, 
                b: card.querySelector('.b').value || '0' 
            });
        });
        localStorage.setItem('workData', JSON.stringify(rows));
        calcGrandTotal();
    }

    function calc(el) {
        const card = el.closest('.work-card');
        const s = card.querySelector('.s').value.split(':');
        const e = card.querySelector('.e').value.split(':');
        const b = parseInt(card.querySelector('.b').value) || 0;
        const val = card.querySelector('.total-val');
        
        if(s.length === 2 && e.length === 2) {
            let startMin = (parseInt(s[0]) * 60) + parseInt(s[1]);
            let endMin = (parseInt(e[0]) * 60) + parseInt(e[1]);
            
            // Gece vardiyası (Overnight) Algoritması
            if (endMin < startMin) {
                endMin += 24 * 60; 
            }
            
            const diff = endMin - startMin - b;
            val.innerText = diff > 0 ? Math.floor(diff/60) + "h " + (diff%60) + "m" : "0h 0m";
        } else {
            val.innerText = "0h 0m";
        }
        calcGrandTotal();
    }

    function calcGrandTotal() {
        let total = 0;
        document.querySelectorAll('.total-val').forEach(el => {
            const parts = el.innerText.match(/(\d+)h (\d+)m/);
            if(parts) total += (parseInt(parts[1])*60) + parseInt(parts[2]);
        });
        document.getElementById('G_TOTAL').innerText = dict[currentLang].gtotal + " " + Math.floor(total/60) + "h " + (total%60) + "m";
    }

    function shareWhatsApp() {
        save();
        let text = `*📊 ${dict[currentLang].title}*\n\n`;
        const cards = document.querySelectorAll('.work-card');
        
        if(cards.length === 0) return;

        cards.forEach(card => {
            const date = card.querySelector('.d').value;
            const start = card.querySelector('.s').value || '--:--';
            const end = card.querySelector('.e').value || '--:--';
            const breakTime = card.querySelector('.b').value || '0';
            const total = card.querySelector('.total-val').innerText;
            text += `📅 *${date}*\n⏱️ ${start} - ${end} (${dict[currentLang].break}: ${breakTime}m) -> *Net: ${total}*\n\n`;
        });
        
        text += `*${document.getElementById('G_TOTAL').innerText}*`;
        
        const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
        window.open(url, '_blank');
    }

    window.addEventListener('beforeunload', save);
    window.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') save();
    });

    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang') || localStorage.getItem('global_lang') || 'fr';
        
        document.getElementById('lang-select').value = lang;
        changeLanguage(lang);

        const saved = JSON.parse(localStorage.getItem('workData') || '[]');
        if(saved.length > 0) {
            saved.forEach(item => addRow(item));
        } else {
            addRow();
        }
    };
</script>
</body>
</html>
