<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Profile Settings - Invoice Luxe | Manage Your Business Profile</title>
    <meta name="description" content="Manage your company profile, IBAN, VAT number and currency settings on Invoice Luxe. Free invoice management for businesses in 6 languages.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://invoiceluxe.com/settings.html" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root { --bg-oak: #8d6e63; --gold-main: #FFD700; --gold-deep: #b8860b; --text-main: #3e2723; --m-black: #121212; --success: #2ecc71; }
        body { margin: 0; background-color: var(--bg-oak); background-image: radial-gradient(circle at 50% -10%, #f5f5f5 0%, transparent 70%), url('https://www.transparenttextures.com/patterns/pichica-wood.png'); color: var(--text-main); font-family: 'Segoe UI Bold', sans-serif; min-height: 100vh; padding: 20px 15px; box-sizing: border-box; }
        header { text-align: center; margin-bottom: 25px; padding-top: 20px; }
        .master-brand-seal { background: linear-gradient(145deg, var(--m-black) 20%, var(--gold-main) 50%, var(--gold-deep)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; letter-spacing: 3px; font-weight: 900; text-transform: uppercase; }
        .luxe-card { background: linear-gradient(145deg, #bcaaa4, #8d6e63); border-radius: 25px; padding: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2.5px solid var(--gold-main); }
        .lang-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
        .lang-box { padding: 8px 0; border-radius: 10px; background: rgba(0,0,0,0.2); color: #fff; text-align: center; cursor: pointer; border: 1px solid var(--gold-main); font-size: 10px; font-weight: 900; transition: 0.3s; text-decoration: none; display: block; }
        .lang-box.active { background: var(--gold-main); color: #000; box-shadow: 0 0 10px var(--gold-main); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 9px; color: var(--m-black); margin-bottom: 4px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--gold-deep); background: #fff !important; color: #000 !important; outline: none; font-size: 13px; font-weight: 700; box-sizing: border-box; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .btn { padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; border: none; font-size: 11px; text-transform: uppercase; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .save-btn { background: linear-gradient(135deg, var(--gold-main), var(--gold-deep)); color: #000; }
        .add-btn { background: var(--m-black); color: var(--gold-main); border: 1px solid var(--gold-main); }
        .skeer-section { margin-top: 30px; }
        .sk-title { font-size: 12px; color: var(--m-black); font-weight: 900; margin-bottom: 15px; display: block; text-transform: uppercase; text-align: center; letter-spacing: 1px; }
        .skeer-wrapper { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px 20px; scrollbar-width: none; }
        .skeer-wrapper::-webkit-scrollbar { display: none; }
        .skeer-card { min-width: 170px; background: linear-gradient(145deg, #3e2723, #1a1510); padding: 18px; border-radius: 20px; border: 2px solid var(--gold-deep); position: relative; transition: all 0.4s; flex-shrink: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor: pointer; }
        .skeer-card.active { border-color: var(--success); background: linear-gradient(145deg, #1d251a, #0a0e08); transform: scale(1.05); }
        .skeer-card b { color: var(--gold-main); font-size: 13px; display: block; margin-bottom: 6px; }
        .skeer-card span { font-size: 10px; color: #d9c8b5; display: block; }
        .del-icon { position: absolute; top: 12px; right: 12px; color: #ff5252; font-size: 20px; cursor: pointer; z-index: 5; }
        #status-msg { display: none; text-align: center; color: var(--m-black); margin-top: 15px; font-weight: 900; font-size: 13px; }
        .nav-back { display: block; text-align: center; margin: 20px auto; color: var(--m-black); text-decoration: none; font-size: 12px; font-weight: 900; text-transform: uppercase; border: 1.5px solid var(--m-black); border-radius: 50px; padding: 10px; width: 150px; }
    </style>
</head>
<body>
    <header><h1 class="master-brand-seal" id="t-head">PROFILE SETTINGS</h1></header>
    <div class="luxe-card">
        <div class="lang-container">
            <div class="lang-box" id="l-tr" onclick="changeSystemLang('tr')">TR</div>
            <div class="lang-box" id="l-nl" onclick="changeSystemLang('nl')">NL</div>
            <div class="lang-box" id="l-en" onclick="changeSystemLang('en')">EN</div>
            <div class="lang-box" id="l-de" onclick="changeSystemLang('de')">DE</div>
            <div class="lang-box" id="l-fr" onclick="changeSystemLang('fr')">FR</div>
            <div class="lang-box" id="l-it" onclick="changeSystemLang('it')">IT</div>
        </div>
        <div class="grid">
            <div class="full"><label id="t-curr">CURRENCY</label><select id="p-curr"><option value="€">Euro (€)</option><option value="₺">Türk Lirası (₺)</option><option value="$">US Dollar ($)</option><option value="£">Pound (£)</option></select></div>
            <div class="full"><label id="t-n">COMPANY NAME</label><input type="text" id="p-n" placeholder="..."></div>
            <div class="full"><label id="t-adr">ADDRESS</label><input type="text" id="p-adr"></div>
            <div><label id="t-pc">POST CODE</label><input type="text" id="p-pc"></div>
            <div><label id="t-ct">CITY</label><input type="text" id="p-ct"></div>
            <div><label id="t-mob">GSM / MOBILE</label><input type="text" id="p-mob"></div>
            <div><label id="t-fix">FIX / LANDLINE</label><input type="text" id="p-fix"></div>
            <div class="full"><label id="t-mail">E-MAIL</label><input type="email" id="p-mail"></div>
            <div><label id="t-bnk">BANK NAME</label><input type="text" id="p-bnk"></div>
            <div><label id="t-i">IBAN NO</label><input type="text" id="p-i"></div>
            <div><label id="t-v">VAT INFO 1</label><input type="text" id="p-v"></div>
            <div><label id="t-tx">VAT INFO 2</label><input type="text" id="p-tx"></div>
        </div>
        <div class="action-btns">
            <button class="btn add-btn" id="t-add"><span class="material-symbols-rounded">add_business</span> <span id="t-addText">NEW</span></button>
            <button class="btn save-btn" id="t-btn" onclick="masterSave()">SAVE & SYNC</button>
        </div>
        <div id="status-msg">✔ SYNCHRONIZED</div>
    </div>
    <div class="skeer-section"><span class="sk-title" id="t-skLabel">REGISTERED COMPANIES</span><div id="skeer-wrapper" class="skeer-wrapper"></div></div>
    <a href="index.html" class="nav-back" id="t-home">← HOME</a>

<script>
    const dictionary = {
        tr: { head: "PROFİL AYARLARI", n:"ŞİRKET ADI", adr:"ADRES", pc:"POSTA KODU", ct:"ŞEHİR", mob:"GSM", fix:"SABİT", mail:"E-POSTA", bnk:"BANKA", i:"IBAN", v:"KDV NO", tx:"VERGİ NO", btn:"KAYDET", addText:"YENİ EKLE", skLabel:"KAYITLI ŞİRKETLER", msg:"✔ GÜNCELLENDİ", home:"ANA SAYFA", curr:"BİRİM", delQ:"Silinsin mi?" },
        nl: { head: "PROFIEL INSTELLINGEN", n:"BEDRIJFSNAAM", adr:"ADRES", pc:"POSTCODE", ct:"STAD", mob:"MOBIEL", fix:"VAST", mail:"E-MAIL", bnk:"BANK", i:"IBAN", v:"KVK-NUMMER", tx:"BTW-NUMMER", btn:"OPSLAAN", addText:"BEDRIJF TOEVOEGEN", skLabel:"BEDRIJVEN", msg:"✔ BIJGEWERKT", home:"MENU", curr:"VALUTA", delQ:"Verwijderen?" },
        en: { head: "PROFILE SETTINGS", n:"COMPANY NAME", adr:"ADDRESS", pc:"POSTCODE", ct:"CITY", mob:"MOBILE", fix:"LANDLINE", mail:"E-MAIL", bnk:"BANK", i:"IBAN", v:"VAT NO", tx:"TAX ID", btn:"SAVE", addText:"ADD COMPANY", skLabel:"SAVED", msg:"✔ SYNCED", home:"HOME", curr:"CURRENCY", delQ:"Delete?" },
        de: { head: "PROFIL EINSTELLUNGEN", n:"FIRMA", adr:"ADRESSE", pc:"PLZ", ct:"STADT", mob:"MOBIL", fix:"FESTNETZ", mail:"E-MAIL", bnk:"BANK", i:"IBAN", v:"UST-IDNR", tx:"STEUER-NR", btn:"SPEICHERN", addText:"FIRMA HINZUFÜGEN", skLabel:"FIRMEN", msg:"✔ OK", home:"HOME", curr:"WÄHRUNG", delQ:"Löschen?" },
        fr: { head: "PROFIL", n:"SOCIÉTÉ", adr:"ADRESSE", pc:"CP", ct:"VILLE", mob:"MOBILE", fix:"FIXE", mail:"E-MAIL", bnk:"BANQUE", i:"IBAN", v:"N° TVA", tx:"N° SIRET", btn:"SAUVER", addText:"AJOUTER SOCIÉTÉ", skLabel:"SOCIÉTÉS", msg:"✔ OK", home:"RETOUR", curr:"DEVISE", delQ:"Supprimer?" },
        it: { head: "PROFILO", n:"AZIENDA", adr:"INDIRIZZO", pc:"CAP", ct:"CITTA", mob:"CELL", fix:"FISSO", mail:"EMAIL", bnk:"BANCA", i:"IBAN", v:"PARTITA IVA", tx:"COD. FISCALE", btn:"SALVA", addText:"AGGIUNGI AZIENDA", skLabel:"AZIENDE", msg:"✔ OK", home:"HOME", curr:"VALUTA", delQ:"Elimina?" }
    };

    let currentL = 'en';
    let skeers = JSON.parse(localStorage.getItem('pro_skeers_localized_v3')) || [];
    let activeCompanyName = localStorage.getItem('active_company_name') || '';

    function checkURLandLang() {
        currentL = localStorage.getItem('global_lang') || 'en';
    }

    function changeSystemLang(langCode) {
        localStorage.setItem('global_lang', langCode);
        currentL = langCode;
        applyLang(langCode);
    }

    function applyLang(l) {
        document.querySelectorAll('.lang-box').forEach(b => b.classList.remove('active'));
        const lBox = document.getElementById('l-' + l);
        if(lBox) lBox.classList.add('active');
        document.documentElement.lang = l;
        const d = dictionary[l] || dictionary['en'];
        Object.keys(d).forEach(k => {
            const el = document.getElementById('t-' + k);
            if(el) el.innerText = d[k];
            const elTxt = document.getElementById('t-' + k + 'Text');
            if(elTxt) elTxt.innerText = d[k];
        });
        document.getElementById('t-home').href = "index.html";
    }

    function updateUI(data) {
        if(!data) return;
        document.getElementById('p-n').value = data.n || '';
        document.getElementById('p-adr').value = data.adr || '';
        document.getElementById('p-pc').value = data.pc || '';
        document.getElementById('p-ct').value = data.ct || '';
        document.getElementById('p-mob').value = data.mob || '';
        document.getElementById('p-fix').value = data.fix || '';
        document.getElementById('p-mail').value = data.mail || '';
        document.getElementById('p-bnk').value = data.bnk || '';
        document.getElementById('p-i').value = data.i || '';
        document.getElementById('p-v').value = data.vat || '';
        document.getElementById('p-tx').value = data.tax || '';
        document.getElementById('p-curr').value = data.curr || '€';
    }

    function renderSkeers() {
        const wrapper = document.getElementById('skeer-wrapper'); wrapper.innerHTML = '';
        skeers.forEach((s, index) => {
            const isActive = s.n.toUpperCase() === activeCompanyName.toUpperCase() ? 'active' : '';
            const card = document.createElement('div');
            card.className = `skeer-card ${isActive}`;
            card.innerHTML = `<span class="material-symbols-rounded del-icon" onclick="deleteSkeer(event, ${index})">delete_forever</span>
                <div onclick="selectSkeer(${index})"><b>${s.n}</b><span>📍 ${s.ct || '-'}</span><span>🆔 ${s.vat || '-'}</span></div>`;
            wrapper.appendChild(card);
        });
    }

    function selectSkeer(index) {
        const s = skeers[index];
        activeCompanyName = s.n;
        localStorage.setItem('active_company_name', s.n);
        localStorage.setItem('pro_profile', JSON.stringify(s));
        updateUI(s);
        renderSkeers();
    }

    function deleteSkeer(e, i) {
        e.stopPropagation();
        if(confirm(dictionary[currentL].delQ)) {
            const targetName = skeers[i].n;
            skeers.splice(i, 1);
            localStorage.setItem('pro_skeers_localized_v3', JSON.stringify(skeers));
            if(activeCompanyName === targetName) {
                if(skeers.length > 0) { selectSkeer(0); }
                else {
                    activeCompanyName = '';
                    localStorage.removeItem('active_company_name');
                    localStorage.removeItem('pro_profile');
                    updateUI({n:'', adr:'', pc:'', ct:'', mob:'', fix:'', mail:'', bnk:'', i:'', tax:'', vat:'', curr:'€'});
                }
            }
            renderSkeers();
        }
    }

    function masterSave() {
        const getV = (id) => document.getElementById(id).value.trim();
        const data = { lang: currentL, curr: getV('p-curr'), n: getV('p-n'), adr: getV('p-adr'), pc: getV('p-pc'), ct: getV('p-ct'), mob: getV('p-mob'), fix: getV('p-fix'), mail: getV('p-mail'), bnk: getV('p-bnk'), i: getV('p-i'), tax: getV('p-tx'), vat: getV('p-v') };
        if(!data.n) { document.getElementById('p-n').style.borderColor = 'red'; return alert("Company Name Required!"); }
        activeCompanyName = data.n;
        localStorage.setItem('active_company_name', data.n);
        localStorage.setItem('pro_profile', JSON.stringify(data));
        const idx = skeers.findIndex(s => s.n.toUpperCase() === data.n.toUpperCase());
        if(idx > -1) skeers[idx] = data; else skeers.push(data);
        localStorage.setItem('pro_skeers_localized_v3', JSON.stringify(skeers));
        renderSkeers();
        document.getElementById('status-msg').innerText = dictionary[currentL].msg;
        document.getElementById('status-msg').style.display = 'block';
        setTimeout(() => { location.href = "index.html"; }, 800);
    }

    document.getElementById('t-add').onclick = () => {
        updateUI({n:'', adr:'', pc:'', ct:'', mob:'', fix:'', mail:'', bnk:'', i:'', tax:'', vat:'', curr:'€', lang:currentL});
        activeCompanyName = '';
        localStorage.removeItem('active_company_name');
        renderSkeers();
        document.getElementById('p-n').focus();
    };

    window.onload = () => {
        checkURLandLang();
        applyLang(currentL);
        const saved = JSON.parse(localStorage.getItem('pro_profile'));
        if(saved) updateUI(saved);
        renderSkeers();
    };
</script>
</body>
</html>
