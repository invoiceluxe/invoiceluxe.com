<style id="mobile-fix">
/* ===== Mobile fixes (layout only, no content changes) ===== */
html,body{max-width:100%;overflow-x:hidden}
#root{overflow-x:clip}
input,button,select{max-width:100%}
.grid>*{min-width:0}
footer a,footer span,#seo-content,#seo-content *{overflow-wrap:anywhere}
#seo-content code{white-space:normal}

@media (max-width:1023px){
  /* Calculator card: results right under the display */
  .vl-a{display:flex;flex-direction:column}
  .vl-a>:nth-child(1),.vl-a>:nth-child(2){order:-2}
  .vl-a>:nth-child(7),.vl-a>:nth-child(8){order:-1}
  .vl-a>.grid.grid-cols-3{margin-top:.5rem}
}

@media (max-width:767px){
  /* Header: not sticky, wraps instead of overflowing */
  header.sticky{position:static}
  header.sticky>div{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;gap:8px}
  header.sticky>div>div:nth-child(2){width:100%;justify-content:space-between;gap:8px}
  header.sticky>div>div:nth-child(2)>a{height:32px;padding:0 12px;font-size:12px;white-space:nowrap}

  /* Compact hero so the calculator is on the first screen */
  #root>div>div:nth-child(2){padding-top:12px;padding-bottom:8px}
  #root>div>div:nth-child(2)>div{gap:6px}
  #root>div>div:nth-child(2)>div span{font-size:11px;padding:3px 8px}
  #root>div>div:nth-child(2)>h1{font-size:20px;line-height:1.2;margin-top:10px}
  #root>div>div:nth-child(2)>p{font-size:12.5px;line-height:1.45;margin-top:6px;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}

  /* Tighter cards */
  .grid.lg\:grid-cols-2{gap:14px}
  .p-5,.sm\:p-6{padding:14px}
  .vl-a>:nth-child(1){margin-bottom:0}
  .vl-a>.shadow-inner{margin-top:10px;padding:12px}
  .vl-a>.shadow-inner>div:nth-child(2){font-size:28px}
  .vl-a>.grid-cols-4{margin-top:10px;gap:6px}
  .vl-a>.grid-cols-4>button{height:42px}
  .vl-a>.grid-cols-3>div{padding:8px}
  .vl-a>.grid-cols-3>div>div:first-child{display:none}
  .vl-a>.grid-cols-3>div>div:nth-child(2){margin-top:0}

  /* iOS: >=16px stops focus-zoom that pushes the layout sideways */
  input[type=number]{font-size:16px!important}
  #seo-content>div{padding:18px}
  .mt-8{margin-top:20px}
  .mt-10{margin-top:24px}
}

@media (max-width:400px){
  header.sticky>div>div:nth-child(2)>div{padding:2px;gap:2px}
  header.sticky>div>div:nth-child(2)>div>button{padding:4px 6px}
  header.sticky>div>div:nth-child(2)>a{padding:0 10px}
}
</style>
</head>
