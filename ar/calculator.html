        background: var(--chip-bg);
        border-radius: 6px;
        padding: 2px;

        top: 2px; bottom: 2px; left: 2px;

        border-radius: 4px;
        background: var(--add);

        color: var(--muted); cursor: pointer; border-radius: 4px;

        font-size: 12.5px;

                <button class="calc-btn" onclick="appendNumber('3')">3</button>
                <button class="calc-btn operator" onclick="appendOperator('+')">+</button>

                <button class="calc-btn" onclick="appendNumber('00')">00</button>
                <button class="calc-btn" onclick="appendNumber('0')">0</button>
                <button class="calc-btn" onclick="appendNumber('.')">.</button>
                <button class="calc-btn equal" onclick="calculate()">=</button>

const LS_KEY = 'elite_lang_v1';

function getCurrentLang() {
  const saved = localStorage.getItem(LS_KEY);
  return LANGS.find(l => l.code === saved) || LANGS[0];
}

function applyLang(lang) {
  const t = T[lang.code] || T.es;
  document.documentElement.setAttribute('dir', lang.dir);
  document.documentElement.setAttribute('lang', lang.code);

  document.getElementById('pill-flag').textContent = lang.flag;
  document.getElementById('pill-code').textContent = lang.code.toUpperCase();

  document.getElementById('brandTitle').textContent = t.title;
  document.getElementById('btnModeAdd').textContent = t.modeAdd;
  document.getElementById('btnModeRemove').textContent = t.modeRemove;
  document.getElementById('applyBtn').textContent = t.apply;
  document.getElementById('lm-title').textContent = t.lmTitle;

  // SEO & Kullanım Kılavuzunu Seçilen Dile Göre Dinamik Güncelle
  document.title = `${t.seoH1} | InvoiceLuxe`;
  document.getElementById('seoH1').textContent = t.seoH1;
  document.getElementById('seoP1').textContent = t.seoP1;
  document.getElementById('seoP2').textContent = t.seoP2;
  document.getElementById('guideH2').textContent = t.guideH2;

  document.getElementById('guideList').innerHTML = `
    <li><strong>${t.s1Title}:</strong> ${t.s1Desc}</li>
    <li><strong>${t.s2Title}:</strong> ${t.s2Desc}</li>
    <li><strong>${t.s3Title}:</strong> ${t.s3Desc}</li>
    <li><strong>${t.s4Title}:</strong> ${t.s4Desc}</li>
    <li><strong>${t.s5Title}:</strong> ${t.s5Desc}</li>
  `;

  refreshBreakdown();
}

function selectLang(code) {
  localStorage.setItem(LS_KEY, code);
  const lang = LANGS.find(l => l.code === code) || LANGS[0];
  applyLang(lang);
  renderLangList();
  closeLangModal();
}

function renderLangList() {
  const current = getCurrentLang();
  const list = document.getElementById('language-list');
  if(!list) return;
  list.innerHTML = LANGS.map(l => `
    <div class="language-item ${l.code === current.code ? 'selected' : ''}" onclick="selectLang('${l.code}')" style="display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; border:1.5px solid #E1E6EE; margin-bottom:6px; cursor:pointer; ${l.code === current.code ? 'border-color:#1D4ED8; background:rgba(29,78,216,0.05);' : ''}">
      <span class="flag" style="font-size:18px;">${l.flag}</span>
      <span class="name" style="flex:1; font-size:13px; font-weight:600; color:#0B1F3A;">${l.name}</span>
      <span class="code2" style="font-size:11.5px; font-weight:700; color:#1D4ED8; text-transform:uppercase;">${l.code.toUpperCase()}</span>
      ${l.code === current.code ? '<i class="fa-solid fa-check" style="color:#1D4ED8; font-size:12px;"></i>' : ''}
    </div>`).join('');
}

function openLangModal(){ renderLangList(); document.getElementById('language-modal').style.display='flex'; }
function closeLangModal(){ document.getElementById('language-modal').style.display='none'; }

const mainDisplay = document.getElementById('mainDisplay');
const breakdown = document.getElementById('breakdown');
const modeToggle = document.getElementById('modeToggle');
let currentExpression = '';
let vatMode = 'add';

function updateDisplay(value) { mainDisplay.innerText = value || '0'; }

function isPlainNumber(str) {
    return /^\d+(\.\d*)?$/.test(str) || /^\.\d*$/.test(str);
}

function formatCurrency(num) { return num.toFixed(2); }

function refreshBreakdown() {
    const lang = getCurrentLang();
    const t = T[lang.code] || T.es;

    if (!isPlainNumber(currentExpression) || currentExpression === '' || currentExpression === '.') {
        breakdown.style.display = 'none';
        return;
    }
    const value = parseFloat(currentExpression);
    const vatRate = parseFloat(document.getElementById('vatRate').value) || 0;
    if (isNaN(value)) { breakdown.style.display = 'none'; return; }

    let base, vatAmt, total;
    if (vatMode === 'add') {
        base = value;
        vatAmt = base * (vatRate / 100);
        total = base + vatAmt;
        document.getElementById('lblRow1').innerText = t.net;
        document.getElementById('lblRow2').innerText = `${t.vat} (+${vatRate}%)`;
        document.getElementById('lblRow3').innerText = t.total;
    } else {
        total = value;
        base = total / (1 + (vatRate / 100));
        vatAmt = total - base;
        document.getElementById('lblRow1').innerText = t.total;
        document.getElementById('lblRow2').innerText = `${t.vat} (-${vatRate}%)`;
        document.getElementById('lblRow3').innerText = t.net;
    }

    document.getElementById('valRow1').innerText = formatCurrency(vatMode === 'add' ? base : total);
    document.getElementById('valRow2').innerText = formatCurrency(vatAmt);
    document.getElementById('valRow3').innerText = formatCurrency(vatMode === 'add' ? total : base);

    breakdown.style.display = 'flex';
}

function appendNumber(num) {
    if (currentExpression === '0') {
        if (num === '0' || num === '00') return;
        if (num !== '.') currentExpression = '';
    }
    if (num === '.') {
        const lastBlock = currentExpression.split(/[+\-*/]/).pop();
        if (lastBlock.includes('.')) return;
    }
    currentExpression += num;
    updateDisplay(currentExpression);
    refreshBreakdown();
}

function appendOperator(operator) {
    if (currentExpression === '') return;
    const lastChar = currentExpression.slice(-1);
    if (['+', '-', '*', '/'].includes(lastChar)) {
        currentExpression = currentExpression.slice(0, -1);
    }
    currentExpression += operator;
    updateDisplay(currentExpression);
    refreshBreakdown();
}

function clearDisplay() {
    currentExpression = '';
    updateDisplay('0');
    breakdown.style.display = 'none';
}

function backspace() {
    currentExpression = currentExpression.slice(0, -1);
    updateDisplay(currentExpression);
    refreshBreakdown();
}

function safeEval(expr) {
    if (!/^[0-9+\-*/.]+$/.test(expr)) throw new Error('invalid');
    return Function(`"use strict"; return (${expr})`)();
}

function calculatePercentage() {
    if (currentExpression === '') return;
    try {
        let result = safeEval(currentExpression) / 100;
        result = Math.round(result * 100000000) / 100000000;
        currentExpression = result.toString();
        updateDisplay(currentExpression);
        refreshBreakdown();
    } catch (e) {
        updateDisplay('Error');
        setTimeout(clearDisplay, 1200);
    }
}

function calculate() {
    if (currentExpression === '') return;
    try {
        let result = safeEval(currentExpression);
        if (!isFinite(result)) throw new Error('inf');
        result = Math.round(result * 100000000) / 100000000;
        currentExpression = result.toString();
        updateDisplay(currentExpression);
        refreshBreakdown();
    } catch (e) {
        updateDisplay('Error');
        setTimeout(clearDisplay, 1200);
    }
}

function setMode(mode) {
    vatMode = mode;
    modeToggle.classList.toggle('mode-add', mode === 'add');
    modeToggle.classList.toggle('mode-remove', mode === 'remove');
    const applyBtn = document.getElementById('applyBtn');
    applyBtn.classList.toggle('remove-style', mode === 'remove');
    refreshBreakdown();
}

function selectRate(rate) {
    document.getElementById('vatRate').value = rate;
    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', parseFloat(c.dataset.rate) === rate);
    });
    refreshBreakdown();
}

function onRateInput() {
    const val = parseFloat(document.getElementById('vatRate').value);
    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', parseFloat(c.dataset.rate) === val);
    });
    refreshBreakdown();
}

function applyVat() {
    if (currentExpression === '') return;
    calculate();
    const value = parseFloat(currentExpression);
    const vatRate = parseFloat(document.getElementById('vatRate').value) || 0;
    if (isNaN(value)) return;

    let result;
    if (vatMode === 'add') {
        result = value + value * (vatRate / 100);
    } else {
        result = value / (1 + (vatRate / 100));
    }
    currentExpression = parseFloat(result.toFixed(2)).toString();
    updateDisplay(formatCurrency(result));
    refreshBreakdown();
}
window.addEventListener('DOMContentLoaded', () => {
  applyLang(LANGS.find(l => l.code === 'ar'));
});
