# Her gün 05:10 UTC'de Vercel Deploy Hook ile yeniden build edilir; tarihi gelen makaleler yayına çıkar.
name: Daily Vercel deploy
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
